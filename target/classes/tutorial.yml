# ═══════════════════════════════════════════════════════════════
# SISTEMA DE TIPS PROGRESIVOS (BASADO EN TIEMPO JUGADO)
# ═══════════════════════════════════════════════════════════════

tips_progresivos:
  enabled: true
  intervalo_minutos: 8              # Cada 8 minutos
  solo_para_tiempo_jugado_minutos: 240  # Solo primeras 4 horas
  mostrar_en_actionbar: true        # Menos intrusivo que chat
  sonido: "BLOCK_NOTE_BLOCK_PLING"
  
  # Tips contextuales según tiempo jugado
  tips:
    # Primeros 30 minutos (Fase 1)
    - mensaje: "&e💡 TIP: &7Usa &f/avo menu &7para ver todas tus opciones."
      tiempo_minimo_minutos: 5
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7Los desastres empiezan muy suaves y aumentan gradualmente."
      tiempo_minimo_minutos: 10
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7Completa misiones con &f/misiones &7para ganar XP rápido."
      tiempo_minimo_minutos: 15
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7El agua apaga el fuego. ¡Lleva siempre un cubo!"
      tiempo_minimo_minutos: 20
      tiempo_maximo_minutos: 30
      
    # 30-60 minutos (Fase 2)
    - mensaje: "&e💡 TIP: &7Construye bajo tierra para estar más seguro de los desastres."
      tiempo_minimo_minutos: 30
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Usa &f/habilidades &7para invertir puntos en tu árbol de habilidades."
      tiempo_minimo_minutos: 35
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Los bloques de protección protegen tu base. ¡Consigue más subiendo de rango!"
      tiempo_minimo_minutos: 45
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Cada misión completada da recompensas extra según dificultad."
      tiempo_minimo_minutos: 50
      tiempo_maximo_minutos: 60
      
    # 1-2 horas (Fase 3)
    - mensaje: "&e💡 TIP: &7Agacharte reduce el knockback del Huracán."
      tiempo_minimo_minutos: 60
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Durante un Terremoto, aléjate del epicentro (zona roja)."
      tiempo_minimo_minutos: 75
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Las evasiones exitosas dan bonus de XP. ¡Practica esquivar!"
      tiempo_minimo_minutos: 90
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Construye múltiples refugios en diferentes ubicaciones."
      tiempo_minimo_minutos: 105
      tiempo_maximo_minutos: 120
      
    # 2-4 horas (Fase 4)
    - mensaje: "&e💡 TIP: &7Cada rango te da habilidades permanentes automáticas."
      tiempo_minimo_minutos: 120
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Usa &f/avo stats &7para ver tus estadísticas y desastres evadidos."
      tiempo_minimo_minutos: 150
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Los desastres no rompen bloques en zonas protegidas de otros jugadores."
      tiempo_minimo_minutos: 180
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Pronto alcanzarás la dificultad global. ¡Prepárate bien!"
      tiempo_minimo_minutos: 210
      tiempo_maximo_minutos: 240
      
    # 4+ horas (Dificultad Global alcanzada)
    - mensaje: "&e💡 TIP: &7Ya tienes la dificultad completa. ¡Sigue mejorando con misiones!"
      tiempo_minimo_minutos: 240
      tiempo_maximo_minutos: 999999

# ═══════════════════════════════════════════════════════════════
# ETAPAS DEL TUTORIAL (INTEGRADAS EN /avo menu)
# ═══════════════════════════════════════════════════════════════

