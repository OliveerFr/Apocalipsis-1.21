# ════════════════════════════════════════════════════════════════════
# Apocalipsis — tutorial.yml
# Sistema de tutorial para nuevos jugadores con dificultad progresiva
# ════════════════════════════════════════════════════════════════════

version: 1

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN GENERAL
# ═══════════════════════════════════════════════════════════════

tutorial:
  enabled: true
  verbose_logging: true              # Logs detallados en consola
  
  # Criterios de detección mejorados
  max_tiempo_jugado_minutos: 60      # Máximo tiempo jugado para activar tutorial (1 hora)
  solo_rango_novato: true            # Solo activar si el jugador es NOVATO
  
  # Esperar 3 minutos antes de iniciar tutorial (tiempo de registro)
  retraso_inicio_minutos: 3
  
  # Mensaje de bienvenida inicial (al conectar)
  mensaje_bienvenida:
    enabled: true
    titulo: "&6&l🌋 APOCALIPSIS SURVIVAL"
    subtitulo: "&e¡Bienvenido, %player%!"
    chat: |
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      &6&l    🌋 BIENVENIDO A APOCALIPSIS SURVIVAL
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      &e¡Bienvenido, &6%player%&e!
      
      &7El tutorial comenzará en &e3 minutos&7.
      &7Mientras tanto, puedes explorar libremente.
      
      &aUsa &f/avo menu &apara ver todas tus opciones.
      
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ═══════════════════════════════════════════════════════════════
# SISTEMA DE DIFICULTAD PROGRESIVA TEMPORAL
# ═══════════════════════════════════════════════════════════════

dificultad_progresiva:
  enabled: true
  
  # Fase 1: MUY FÁCIL (Primeros 30 minutos)
  fase_1:
    duracion_minutos: 30
    multiplicador_daño: 0.1           # 10% del daño normal
    multiplicador_frecuencia: 0.2     # 80% menos frecuentes
    permitir_knockback: false         # Sin empujones
    xp_bonus: 1.5                     # +50% XP
    regeneracion_pasiva: true         # Regeneración I permanente
    nombre: "&a🌱 Fase Tutorial"
    descripcion: "Desastres muy suaves"
    
  # Fase 2: FÁCIL (30-60 minutos)
  fase_2:
    duracion_minutos: 30
    multiplicador_daño: 0.25          # 25% del daño
    multiplicador_frecuencia: 0.4     # 60% menos frecuentes
    permitir_knockback: false         # Sin empujones
    xp_bonus: 1.3                     # +30% XP
    regeneracion_pasiva: true         # Regeneración I permanente
    nombre: "&e🔰 Fase Adaptación"
    descripcion: "Desastres suaves"
    
  # Fase 3: MODERADO (1-2 horas)
  fase_3:
    duracion_minutos: 60
    multiplicador_daño: 0.5           # 50% del daño
    multiplicador_frecuencia: 0.6     # 40% menos frecuentes
    permitir_knockback: true          # Ya puede empujar
    xp_bonus: 1.2                     # +20% XP
    regeneracion_pasiva: false        # Sin regeneración
    nombre: "&6⚡ Fase Intermedia"
    descripcion: "Desastres moderados"
    
  # Fase 4: NORMAL (2-4 horas)
  fase_4:
    duracion_minutos: 120
    multiplicador_daño: 0.75          # 75% del daño
    multiplicador_frecuencia: 0.8     # 20% menos frecuentes
    permitir_knockback: true          # Ya puede empujar
    xp_bonus: 1.1                     # +10% XP
    regeneracion_pasiva: false        # Sin regeneración
    nombre: "&c⚔️ Fase Avanzada"
    descripcion: "Desastres fuertes"
    
  # Después de 240 minutos (4 horas): Dificultad Global (100%)
  fase_final:
    multiplicador_daño: 1.0           # 100% dificultad global
    multiplicador_frecuencia: 1.0     # Igual que todos
    permitir_knockback: true          # Normal
    xp_bonus: 1.0                     # Sin bonus
    regeneracion_pasiva: false        # Sin regeneración
    nombre: "&4💀 Dificultad Global"
    descripcion: "Sin protección"
  
  # Notificaciones de cambio de fase
  notificar_cambio_fase:
    enabled: true
    mostrar_titulo: true
    titulo: "&e⚠️ CAMBIO DE DIFICULTAD"
    subtitulo: "&7%fase_anterior% → %fase_nueva%"
    sonido: "ENTITY_PLAYER_LEVELUP"
    mensaje_chat: |
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      &e⚠️ &6CAMBIO DE DIFICULTAD
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Fase anterior: %fase_anterior%
      &7Nueva fase: %fase_nueva%
      
      &7Dificultad: &c%porcentaje_anterior%% &7→ &c%porcentaje_nuevo%%
      
      &7Los desastres ahora son %descripcion%.
      &a¡Sigue construyendo tu base!
      
      &7Próxima fase en: &e%tiempo_restante%
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
  # Notificación al alcanzar dificultad global
  mensaje_dificultad_global:
    enabled: true
    mostrar_titulo: true
    titulo: "&4&l⚔️ DIFICULTAD GLOBAL"
    subtitulo: "&c¡Fase de adaptación completada!"
    sonido: "UI_TOAST_CHALLENGE_COMPLETE"
    fuegos_artificiales: 3
    mensaje_chat: |
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      &4&l    ⚔️ DIFICULTAD GLOBAL ALCANZADA
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      &e¡Has completado la fase de adaptación!
      
      &cAhora los desastres tienen FUERZA COMPLETA.
      &cYa no tienes protección especial.
      
      &6💡 Consejos finales:
      &7• Completa misiones diarias para mejorar
      &7• Sube de rango para obtener habilidades
      &7• Construye una base bien protegida
      &7• ¡Usa &f/avo menu &7para ver tu progreso!
      
      &a¡Buena suerte, sobreviviente! &c🔥
      
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  # Notificación en ActionBar (cada 10 minutos)
  actionbar_progreso:
    enabled: true
    intervalo_minutos: 10
    formato: "&e⏰ Dificultad: &c%porcentaje%% &8| &7Próxima fase en: &e%tiempo_restante% &8| &f/avo menu"

# ═══════════════════════════════════════════════════════════════
# KIT DE INICIO PARA NUEVOS JUGADORES
# ═══════════════════════════════════════════════════════════════

kit_inicio:
  enabled: true
  otorgar_automatico: true
  dar_inmediatamente: true          # Dar INMEDIATAMENTE al entrar (antes de morir)
  
  items:
    # Armadura de HIERRO ENCANTADA (Protección II, Durabilidad III)
    - "give %player% minecraft:iron_helmet{Enchantments:[{id:\"minecraft:protection\",lvl:2},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_chestplate{Enchantments:[{id:\"minecraft:protection\",lvl:2},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_leggings{Enchantments:[{id:\"minecraft:protection\",lvl:2},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_boots{Enchantments:[{id:\"minecraft:protection\",lvl:2},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    
    # Herramientas de HIERRO ENCANTADAS
    - "give %player% minecraft:iron_pickaxe{Enchantments:[{id:\"minecraft:efficiency\",lvl:3},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_axe{Enchantments:[{id:\"minecraft:efficiency\",lvl:3},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_sword{Enchantments:[{id:\"minecraft:sharpness\",lvl:2},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    - "give %player% minecraft:iron_shovel{Enchantments:[{id:\"minecraft:efficiency\",lvl:3},{id:\"minecraft:unbreaking\",lvl:3}]} 1"
    
    # Supervivencia básica MEJORADA
    - "give %player% minecraft:cooked_beef 32"
    - "give %player% minecraft:bread 32"
    - "give %player% minecraft:golden_apple 4"
    - "give %player% minecraft:water_bucket 2"
    - "give %player% minecraft:lava_bucket 1"
    
    # Recursos de construcción
    - "give %player% minecraft:oak_log 64"
    - "give %player% minecraft:cobblestone 128"
    - "give %player% minecraft:torch 64"
    
    # Items útiles
    - "give %player% minecraft:bed 1"
    - "give %player% minecraft:crafting_table 2"
    - "give %player% minecraft:chest 4"
    
    # Materiales de construcción
    - "give %player% minecraft:cobblestone 128"
    - "give %player% minecraft:dirt 64"
    - "give %player% minecraft:torch 32"
    - "give %player% minecraft:oak_planks 64"
    
    # Extras
    - "give %player% minecraft:bed 1"
    - "give %player% minecraft:crafting_table 1"
    - "give %player% minecraft:furnace 1"
    - "give %player% minecraft:bucket 2"
    
  mensaje_entrega:
    mostrar_titulo: true
    titulo: "&6&l🎁 KIT DE INICIO"
    subtitulo: "&e¡Comienza tu aventura!"
    sonido: "ENTITY_PLAYER_LEVELUP"
    mensaje_chat: |
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      &6&l       🎓 TUTORIAL INTERACTIVO
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      
      &e¡Es hora de aprender a sobrevivir!
      
      &a✅ Kit de inicio entregado
      &a✅ Dificultad: &2MUY FÁCIL (10%)
      &a✅ Subirá gradualmente en 4 horas
      
      &7Usa &f/avo menu &7para ver el tutorial completo.
      
      &8&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

