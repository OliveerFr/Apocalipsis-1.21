# ═══════════════════════════════════════════════════════════════
# SISTEMA DE TIPS PROGRESIVOS (BASADO EN TIEMPO JUGADO)
# ═══════════════════════════════════════════════════════════════

tips_progresivos:
  enabled: true
  intervalo_minutos: 8              # Cada 8 minutos
  solo_para_tiempo_jugado_minutos: 240  # Solo primeras 4 horas
  mostrar_en_actionbar: true        # Menos intrusivo que chat
  sonido: "BLOCK_NOTE_BLOCK_PLING"
  
  # NUEVO: Evitar spam y repetición
  evitar_repeticion_sesion: true    # No mostrar el mismo tip dos veces en una sesión
  ignorar_afk: true                 # No mostrar tips si el jugador está AFK
  tiempo_afk_minutos: 5             # Considerar AFK después de 5 minutos sin movimiento
  
  # Tips contextuales según tiempo jugado
  tips:
    # Primeros 30 minutos (Fase 1)
    - mensaje: "&e💡 TIP: &7Usa &f/avo menu &7para ver todas tus opciones."
      tiempo_minimo_minutos: 5
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7Los desastres empiezan muy suaves y aumentan gradualmente."
      tiempo_minimo_minutos: 10
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7Completa misiones con &f/misiones &7para ganar XP rápido."
      tiempo_minimo_minutos: 15
      tiempo_maximo_minutos: 30
      
    - mensaje: "&e💡 TIP: &7El agua apaga el fuego. ¡Lleva siempre un cubo!"
      tiempo_minimo_minutos: 20
      tiempo_maximo_minutos: 30
      
    # 30-60 minutos (Fase 2)
    - mensaje: "&e💡 TIP: &7Construye bajo tierra para estar más seguro de los desastres."
      tiempo_minimo_minutos: 30
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Usa &f/habilidades &7para invertir puntos en tu árbol de habilidades."
      tiempo_minimo_minutos: 35
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Los bloques de protección protegen tu base. ¡Consigue más subiendo de rango!"
      tiempo_minimo_minutos: 45
      tiempo_maximo_minutos: 60
      
    - mensaje: "&e💡 TIP: &7Cada misión completada da recompensas extra según dificultad."
      tiempo_minimo_minutos: 50
      tiempo_maximo_minutos: 60
      
    # 1-2 horas (Fase 3)
    - mensaje: "&e💡 TIP: &7Agacharte reduce el knockback del Huracán."
      tiempo_minimo_minutos: 60
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Durante un Terremoto, aléjate del epicentro (zona roja)."
      tiempo_minimo_minutos: 75
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Las evasiones exitosas dan bonus de XP. ¡Practica esquivar!"
      tiempo_minimo_minutos: 90
      tiempo_maximo_minutos: 120
      
    - mensaje: "&e💡 TIP: &7Construye múltiples refugios en diferentes ubicaciones."
      tiempo_minimo_minutos: 105
      tiempo_maximo_minutos: 120
      
    # 2-4 horas (Fase 4)
    - mensaje: "&e💡 TIP: &7Cada rango te da habilidades permanentes automáticas."
      tiempo_minimo_minutos: 120
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Usa &f/avo stats &7para ver tus estadísticas y desastres evadidos."
      tiempo_minimo_minutos: 150
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Los desastres no rompen bloques en zonas protegidas de otros jugadores."
      tiempo_minimo_minutos: 180
      tiempo_maximo_minutos: 240
      
    - mensaje: "&e💡 TIP: &7Pronto alcanzarás la dificultad global. ¡Prepárate bien!"
      tiempo_minimo_minutos: 210
      tiempo_maximo_minutos: 240
      
    # 4+ horas (Dificultad Global alcanzada)
    - mensaje: "&e💡 TIP: &7Ya tienes la dificultad completa. ¡Sigue mejorando con misiones!"
      tiempo_minimo_minutos: 240
      tiempo_maximo_minutos: 999999

# ═══════════════════════════════════════════════════════════════
# ETAPAS DEL TUTORIAL (INTEGRADAS EN /avo menu)
# ═══════════════════════════════════════════════════════════════

etapas_tutorial:
  # Etapa 1: Menú Principal
  etapa_1:
    titulo: "&6🎯 Paso 1: Menú Principal"
    descripcion: "Aprende a usar /avo menu"
    completar_automaticamente: true
    
  # Etapa 2: Desastres Naturales
  etapa_2:
    titulo: "&6🌋 Paso 2: Desastres"
    descripcion: "Conoce los 3 tipos de desastres"
    
  # Etapa 3: Supervivencia
  etapa_3:
    titulo: "&6🛡️ Paso 3: Supervivencia"
    descripcion: "Aprende las prioridades básicas"
    
  # Etapa 4: Progresión
  etapa_4:
    titulo: "&6📈 Paso 4: Sistema de Rangos"
    descripcion: "Conoce cómo mejorar"
    
  # Etapa 5: Demo de Rangos
  etapa_5:
    titulo: "&b✨ Paso 5: Demo de EXPLORADOR"
    descripcion: "¡Experimenta los beneficios!"
    
  # Etapa 6: Árbol de Habilidades
  etapa_6:
    titulo: "&6🌳 Paso 6: Habilidades"
    descripcion: "Personaliza tu estilo de juego"
    
  # Etapa 7: Comandos
  etapa_7:
    titulo: "&6📋 Paso 7: Comandos Clave"
    descripcion: "Memoriza los comandos importantes"

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN AVANZADA
# ═══════════════════════════════════════════════════════════════

avanzado:
  # Almacenar progreso del tutorial en archivos YAML
  guardar_progreso: true
  intervalo_guardado_minutos: 5     # Guardar cada 5 minutos automáticamente
  
  # Permitir que jugadores salten el tutorial
  permitir_saltar_tutorial: false
  
  # Comandos para administradores
  comandos_admin:
    - "/tutorial progreso"            # Ver progreso del tutorial
    - "/tutorial reset <jugador>"     # Reiniciar tutorial de un jugador
    - "/tutorial fase <jugador> <1-5>" # Cambiar fase manualmente
    - "/tutorial stats"               # Ver métricas globales
    
  # Métricas y análisis
  metricas:
    enabled: true                     # Sistema de tracking activado
    trackear_completado: true
    trackear_tiempo_por_etapa: true
    trackear_muertes_durante_tutorial: true
    generar_reporte_cada_horas: 24   # Reporte automático cada 24 horas

# ═══════════════════════════════════════════════════════════════
# SISTEMA DE LOGROS DEL TUTORIAL
# ═══════════════════════════════════════════════════════════════

logros_tutorial:
  enabled: true
  
  # Logros automáticos
  logros:
    primer_desastre_evadido:
      titulo: "&a✓ Primera Evasión"
      descripcion: "Evadiste tu primer desastre"
      # Recompensa se da automáticamente por el sistema de evasión
      
    primera_mision_completada:
      titulo: "&a✓ Misionero Novato"
      descripcion: "Completaste tu primera misión"
      # Recompensa se da automáticamente por el sistema de misiones
      
    treinta_minutos_supervivencia:
      titulo: "&a✓ Sobreviviente"
      descripcion: "Sobreviviste 30 minutos"
      recompensa:
        items:
          - "give %player% minecraft:golden_apple 3"
        mensaje: "&a+3 Manzanas Doradas"
      
    alcanzar_fase_3:
      titulo: "&6✓ Veterano en Entrenamiento"
      descripcion: "Alcanzaste la Fase 3"
      recompensa:
        xp_bonus: 200
        mensaje: "&a+200 XP"
      
    tutorial_completado:
      titulo: "&6&l✓ TUTORIAL COMPLETADO"
      descripcion: "¡Completaste el tutorial completo!"
      recompensa:
        items:
          - "give %player% minecraft:diamond 8"
          - "give %player% minecraft:golden_apple 5"
        xp_bonus: 500
        mensaje: |
          &a¡Recompensas del Tutorial!
          &7• 8 Diamantes 💎
          &7• 5 Manzanas Doradas 🍎
          &7• 500 XP ⭐

# ═══════════════════════════════════════════════════════════════
# PROTECCIÓN DURANTE TUTORIAL
# ═══════════════════════════════════════════════════════════════

proteccion_tutorial:
  enabled: true
  
  # Proteger items al morir (primeros minutos)
  proteger_items_minutos: 15        # Proteger items primeros 15 minutos
  mantener_nivel: true              # No perder niveles al morir
  
  # Mensajes contextuales según muerte
  mensajes_muerte_contextuales:
    enabled: true
