# ═══════════════════════════════════════════════════════════════════
# CONTROL DE CICLO - Flags críticos para evitar inicios automáticos
# ═══════════════════════════════════════════════════════════════════
ciclo:
  auto_cycle: true                # Si false, NUNCA iniciar automáticamente
  start_on_boot: true              # ✅ ACTIVADO: Iniciar automáticamente al encender/reload
  min_jugadores: 1                 # No iniciar si < este número online
  respectar_cooldown: true         # Respetar cooldown entre desastres
  cooldown_fin_segundos: 900        # ⚡ 1 minuto de cooldown entre desastres (reducido de 15min)
  preparacion_inicial_segundos: 900  # Duración de preparación al usar /avo start (15 min)
  
  # NUEVO: Toggle para usar desastres del Ciclo 2 (nuevos) o Ciclo 1 (originales)
  usar_desastres_nuevos: true      # true = Ciclo 2 (Tormenta Glacial, etc), false = Ciclo 1 (Huracán, etc)

# ═══════════════════════════════════════════════════════════════════
# DESASTRES CICLO 1 (ORIGINALES) - Desactivados cuando usar_desastres_nuevos=true
# ═══════════════════════════════════════════════════════════════════
desastres:
  weights:
    huracan: 0                     # Desactivado - reemplazado por tormenta_glacial
    lluvia_fuego: 0                # Desactivado - reemplazado por tormenta_electrica  
    terremoto: 0                   # Desactivado - reemplazado por erupcion_volcanica
  
  # NUEVO: Pesos para desastres del Ciclo 2
  weights_ciclo_2:
    tormenta_glacial: 1
    tormenta_electrica: 1
    erupcion_volcanica: 1
  
  explosion_power: 1.2
  
  rayos:
    enabled: true
    min_delay_ticks: 100
    max_delay_ticks: 240
  
  debris:
    enabled: true
    max_por_jugador: 2
  
  huracan:
    duracion_segundos: 90
    romper_bloques: false  # [#6] Controla si altera bloques físicamente
    
    # Sistema de fases de intensidad (inicio/pico/declive)
    fases:
      enabled: true  # Si true, intensidad varía: inicio 0.5x → pico 1.5x → declive 0.8x
    
    # Visual debris seguros (FallingBlock sin gravity)
    visual_debris:
      enabled: true
      materiales: ["DIRT","COBBLESTONE","OAK_LOG","OAK_LEAVES","GRASS_BLOCK","STONE"]
      max_por_jugador: 8
      tiempo_despawn_seg: 20
    
    # Empuje de viento
    push:
      max_horizontal: 0.18
      clamp_total: 0.22
      bajo_techo_reduction: 0.6  # Refugio bajo techo = 60% menos empuje
      agachado_reduction: 0.55   # Agacharse = 55% menos empuje
    
    # Clima
    clima:
      lluvia: true
      truenos: true
    
    # Rayos mejorados con targeting y efectos de estática
    rayos:
      enabled: true
      min_delay_ticks: 80          # Mayor frecuencia que antes (era 100)
      max_delay_ticks: 180         # Mayor frecuencia que antes (era 240)
      target_exposed_players: true # Preferencia por jugadores sin techo
      static_effect: true          # Efecto glowing 2s antes del impacto
    
    # NUEVO: Sistema de rachas de viento (calma vs ráfagas extremas)
    rachas_viento:
      enabled: true
      duracion_ticks: 100          # Duración de cada ráfaga (5 segundos)
      intervalo_ticks: 300         # Intervalo entre ráfagas (15 segundos)
      multiplicador: 2.5           # Empuje durante ráfaga = 2.5x normal
    
    # NUEVO: Objetos voladores que pueden golpear jugadores
    objetos_voladores:
      enabled: true
      max_activos: 15              # Máximo de objetos volando simultáneamente
      spawn_interval_ticks: 20     # Cada cuánto spawn nuevos (1 segundo)
      damage: 1.5                  # Daño al impactar (0.75 corazones)
      materiales: ["STICK","DIRT","COBBLESTONE","OAK_LEAVES","GRAVEL","SAND"]
    
    # NUEVO: Inundación progresiva en zonas bajas
    inundacion:
      enabled: true
      nivel_maximo: 2              # Altura máxima de agua acumulada
      tick_interval: 100           # Cada cuánto expande (5 segundos)
    
    # NUEVO: Visibilidad reducida por lluvia intensa
    visibilidad_reducida:
      enabled: true
      duracion_ticks: 60           # Duración de ceguera (3 segundos)
      interval_ticks: 200          # Cada cuánto aplica (10 segundos)
    
    random_damage:
      chance: 0.10

  lluvia_fuego:
    duracion_segundos: 90
    romper_bloques: true
    prender_fuego: true
    fuego_dura_seg: 8
    densidad: 0.3                # Densidad de bolas de fuego (0.5 = moderado, 0.9 = muy intenso)
    explosion_power: 1.0         # Poder de explosión (1.0 = balanceado, 1.2 = más daño)
    apaga_todo_al_finalizar: true
    
    # NUEVO: Sistema de fases (intensidad varía durante el desastre)
    fases:
      enabled: true
      # Fase 1 (0-25%): 0.8x inicio moderado
      # Fase 2 (25-75%): 1.4x pico intenso
      # Fase 3 (75-100%): 0.9x declive
    
    # NUEVO: Meteoritos grandes con advertencia visual
    meteoritos:
      enabled: true
      intervalo_ticks: 900         # Cada 30 segundos un meteorito (reducido de 20s)
      explosion_power: 2.5         # Explosión 2.5x más grande (reducido de 3.0)
      advertencia_ticks: 60        # 3 segundos de advertencia visual (columna roja)
    
    # NUEVO: Calor extremo constante
    calor_extremo:
      enabled: true
      damage_interval_ticks: 200    # Daño cada 10 segundos si no hay techo
    
    # NUEVO: Lluvia de ceniza (ceguera temporal)
    ceniza:
      enabled: true
      duracion_ticks: 100          # Duración de ceguera + slowness (5 segundos)
    
    # NUEVO: Transformación del terreno (grass → coarse dirt, hojas → aire)
    transformacion_terreno:
      enabled: true
      # Transforma: GRASS_BLOCK/DIRT → COARSE_DIRT, hojas → AIR, WATER → AIR
    
    # NUEVO: Trayectorias parabólicas en lugar de caída vertical
    trayectorias:
      enabled: true
      velocidad: 0.5               # Velocidad del proyectil curvo
    
    # NUEVO: Zonas de fuego persistente (se mantienen encendidas)
    fuegos_persistentes:
      enabled: true
      radius: 1                    # Radio de fuegos alrededor de impactos
    
    # Rotura de bloques de protección (MEJORADO - MUY REDUCIDO)
    # Las bolas de fuego tienen probabilidad de romper bloques de agua cercanos
    # Esto fuerza a los jugadores a reponer constantemente su protección
    # AHORA: probabilidad muy baja, el agua es efectiva como protección
    romper_proteccion:
      enabled: true
      probabilidad: 0.004          # 0.4% de probabilidad por impacto (reducido de 2%)
      probabilidad_meteorito: 0.015  # 1.5% para meteoritos (más destructivos)
      cantidad_bloques: 1          # Rompe hasta 1 bloque de agua por impacto (reducido de 2)
      radio_busqueda: 2            # Radio para buscar agua (NUEVO)
      cooldown_ticks: 180          # Cooldown de 9 segundos entre roturas (NUEVO)
      proteger_agua_profunda: true  # No romper agua si hay 2+ bloques de agua apilados (NUEVO)
    
    random_damage:
      chance: 0.25

  terremoto:
    duracion_segundos: 90
    romper_bloques: true
    # Lista de bloques débiles que puede romper el terremoto
    romper_whitelist: 
      - "DIRT"
      - "GRASS_BLOCK"
      - "COBBLESTONE"
      - "STONE"
      - "GRAVEL"
      - "SAND"
      - "COARSE_DIRT"
      - "PODZOL"
      - "MYCELIUM"
      - "SAND"
      - "RED_SAND"
      - "CLAY"
      - "SOUL_SAND"
      - "SOUL_SOIL"
      - "NETHERRACK"
      - "END_STONE"
      - "CALCITE"
      - "TUFF"
      - "DRIPSTONE_BLOCK"
      - "DEEPSLATE"
      - "GRANITE"
      - "DIORITE"
      - "ANDESITE"
    shake_intensity: 0.08
    shake_every_ticks: 3
    break_chance: 0.02  # Probabilidad base (fallback para materiales no especificados)
    break_radius: 3
    
    # NUEVO: Probabilidades de rotura por dureza de material
    # Escala realista: blandos (2%) → medios (1%) → duros (0.5%) → muy duros (0.25%)
    durability:
      soft: 0.02        # Tierra, arena, grava, arcilla (más fácil de romper)
      medium: 0.01      # Piedra labrada, netherrack, end stone (resistencia moderada)
      hard: 0.005       # Piedra, granito, diorita, andesita, deepslate (alta resistencia)
      very_hard: 0.0025 # Tuff, calcita, basalto, blackstone (máxima resistencia)
    
    damage:
      base_corazones: 0.0
      max_por_pulso: 0.5
    random_damage:
      chance: 0.20
    
    # NUEVO: Sistema de fases (intensidad varía durante el desastre)
    fases:
      enabled: true
      # Fase 1 (0-30%): 0.7x inicio ligero
      # Fase 2 (30-70%): 1.3x pico intenso
      # Fase 3 (70-100%): 0.9x declive
    
    # NUEVO: Grietas en el suelo (fisuras largas con lava/aire)
    grietas:
      enabled: true
      max_activas: 5  # Máximo de grietas simultáneas
      longitud_maxima: 8  # Longitud máxima de cada grieta
    
    # NUEVO: Derrumbes (bloques caen desde arriba)
    derrumbes:
      enabled: true
      chance_por_tick: 0.05  # Probabilidad de derrumbe por jugador por tick
      max_altura_busqueda: 10  # Altura máxima para buscar bloques que puedan caer
    
    # NUEVO: Aftershocks (réplicas sísmicas periódicas)
    aftershocks:
      enabled: true
      intervalo_ticks: 300  # Cada 15 segundos una réplica
      multiplicador_intensidad: 1.5  # Las réplicas son 1.5x más intensas
    
    # NUEVO: Ondas sísmicas visuales
    ondas_sismicas:
      enabled: true
      intervalo_ticks: 80  # Cada 4 segundos genera una onda
    
    # NUEVO: Desorientación mejorada
    desorientacion:
      enabled: true
      duracion_ticks: 100  # Duración de slowness + mining fatigue
    
    # Sistema de absorción de impacto (MEJORADO)
    # Bloques específicos cerca del jugador reducen el efecto del terremoto
    absorcion_impacto:
      enabled: true
      radio_deteccion: 6  # Radio de búsqueda de bloques absorbentes (aumentado de 5 a 6)
      reduccion_shake_por_bloque: 0.45  # Reduce intensidad de temblores 45% por bloque (aumentado de 40%)
      reduccion_break_por_bloque: 0.60  # Reduce probabilidad de rotura 60% por bloque (aumentado de 50%)
      reduccion_damage_por_bloque: 0.35  # Reduce daño y derrumbes 35% por bloque (aumentado de 25%)
      max_bloques_efectivos: 5  # Máximo de bloques que cuentan para protección (aumentado de 4)
      materiales:  # Bloques que absorben vibraciones sísmicas
        - "WHITE_WOOL"
        - "ORANGE_WOOL"
        - "MAGENTA_WOOL"
        - "LIGHT_BLUE_WOOL"
        - "YELLOW_WOOL"
        - "LIME_WOOL"
        - "PINK_WOOL"
        - "GRAY_WOOL"
        - "LIGHT_GRAY_WOOL"
        - "CYAN_WOOL"
        - "PURPLE_WOOL"
        - "BLUE_WOOL"
        - "BROWN_WOOL"
        - "GREEN_WOOL"
        - "RED_WOOL"
        - "BLACK_WOOL"
        - "SLIME_BLOCK"
        - "BLUE_ICE"
        - "HAY_BLOCK"
        - "HONEY_BLOCK"  # NUEVO: Bloque de miel también absorbe
        - "SPONGE"       # NUEVO: Esponja también absorbe
        - "WET_SPONGE"   # NUEVO: Esponja mojada también absorbe
    
    # Rotura de bloques de protección (MEJORADO - MUY REDUCIDO)
    # El terremoto puede romper los bloques absorbentes, forzando al jugador a reponerlos
    # AHORA: probabilidad muy baja, requiere múltiples réplicas para romper protección
    romper_proteccion:
      enabled: true
      probabilidad: 0.003         # 0.3% de probabilidad por segundo (reducido de 2%)
      probabilidad_aftershock: 0.008  # 0.8% durante réplicas (más daño en aftershocks)
      cantidad_bloques: 1         # Romper solo 1 bloque absorbente por evento
      cooldown_ticks: 200         # Cooldown de 10 segundos entre roturas (NUEVO)
      priorizar_bloques_viejos: true  # Romper primero los bloques más antiguos (NUEVO)

  # ❄️ TORMENTA GLACIAL - Reemplazo del Huracán (CICLO 2)
  tormenta_glacial:
    duracion_segundos: 90
    
    congelacion:
      enabled: true
      radio: 3
      intervalo_ticks: 100  # Cada 5s
      agua_a_hielo: true
      bloques_mojados: true
    
    hipotermia:
      enabled: true
      damage_base: 0.5
      intervalo_base_ticks: 200  # 10s
      incremento_acumulativo: 0.25
      intervalo_incremento_ticks: 600  # 30s
    
    rafagas_heladas:
      enabled: true
      intervalo_ticks: 400  # 20s
      slowness_level: 2
      slowness_duration_ticks: 120  # 6s
      mining_fatigue_level: 1
      mining_fatigue_duration_ticks: 80  # 4s
      multiplicador_intensidad: 2.5
    
    cristales_hielo:
      enabled: true
      intervalo_ticks: 300  # 15s
      min_cristales: 3
      max_cristales: 6
      damage: 1.0
      freeze_duration_ticks: 60  # 3s
    
    estalactitas:
      enabled: true
      advertencia_ticks: 40  # 2s
      damage_min: 2.0
      damage_max: 4.0
      chance_por_jugador: 0.15
    
    niebla:
      enabled: true
      solo_en_pico: true
      intervalo_ticks: 800  # 40s
      duracion_ticks: 100  # 5s
      particle_count: 300
    
    proteccion:
      zonas_calientes:
        enabled: true
        radio_deteccion: 4
        reduccion_damage: 0.80
        fuentes:
          - "CAMPFIRE"
          - "SOUL_CAMPFIRE"
          - "LAVA"
          - "MAGMA_BLOCK"
          - "FIRE"
      
      armadura:
        cuero_reduccion: 0.30
        netherite_reduccion: 0.50
      
      refugio:
        techo_reduccion: 0.40
        paredes_completas_reduccion: 0.60
    
    fases:
      enabled: true

  # ⚡ TORMENTA ELÉCTRICA - Reemplazo de Lluvia de Fuego (CICLO 2)
  tormenta_electrica:
    duracion_segundos: 90
    
    rayos_dirigidos:
      enabled: true
      advertencia_ticks: 60  # 3s
      damage: 3.0
      incendiar_bloques: true
      priorizar_sin_techo: true
    
    cadenas_electricas:
      enabled: true
      radio_salto: 5
      max_saltos: 3
      damage_base: 3.0
      reduccion_por_salto: 1.0
    
    sobrecarga_electrica:
      enabled: true
      multiplicador_atraccion: 3.0
      items_metalicos:
        - "IRON_HELMET"
        - "IRON_CHESTPLATE"
        - "IRON_LEGGINGS"
        - "IRON_BOOTS"
        - "GOLDEN_HELMET"
        - "GOLDEN_CHESTPLATE"
        - "GOLDEN_LEGGINGS"
        - "GOLDEN_BOOTS"
        - "NETHERITE_HELMET"
        - "NETHERITE_CHESTPLATE"
        - "NETHERITE_LEGGINGS"
        - "NETHERITE_BOOTS"
        - "IRON_SWORD"
        - "IRON_AXE"
        - "IRON_PICKAXE"
    
    zonas_ionizadas:
      enabled: true
      radio: 4
      duracion_ticks: 300  # 15s
      damage_por_segundo: 0.5
      particle_density: 40
    
    emp_pulse:
      enabled: true
      solo_en_pico: true
      intervalo_ticks: 900  # 45s
      radio: 12
      duracion_ticks: 200  # 10s
      afecta_elytras: true
      afecta_riptide: true
      afecta_crossbows: true
    
    cortocircuito:
      enabled: true
      radio_desde_rayo: 6
      duracion_ticks: 160  # 8s
    
    proteccion:
      lightning_rods:
        enabled: true
        radio_proteccion: 16
        prioridad_sobre_jugador: true
      
      bloques_aislantes:
        enabled: true
        reduccion_probabilidad: 0.70
        materiales:
          - "OAK_PLANKS"
          - "SPRUCE_PLANKS"
          - "BIRCH_PLANKS"
          - "JUNGLE_PLANKS"
          - "ACACIA_PLANKS"
          - "DARK_OAK_PLANKS"
          - "CRIMSON_PLANKS"
          - "WARPED_PLANKS"
          - "WHITE_WOOL"
          - "ORANGE_WOOL"
          - "MAGENTA_WOOL"
          - "LIGHT_BLUE_WOOL"
          - "YELLOW_WOOL"
          - "LIME_WOOL"
          - "PINK_WOOL"
          - "GRAY_WOOL"
          - "LIGHT_GRAY_WOOL"
          - "CYAN_WOOL"
          - "PURPLE_WOOL"
          - "BLUE_WOOL"
          - "BROWN_WOOL"
          - "GREEN_WOOL"
          - "RED_WOOL"
          - "BLACK_WOOL"
          - "GLASS"
      
      agua_vulnerabilidad:
        multiplicador_damage: 2.0
        multiplicador_radio_cadenas: 2.0
        multiplicador_duracion_zonas: 2.0
      
      techo_solido:
        inmunidad_completa: true
        altura_minima: 3
    
    fases:
      enabled: true

  # 🌋 ERUPCIÓN VOLCÁNICA - Reemplazo del Terremoto (CICLO 2)
  erupcion_volcanica:
    duracion_segundos: 90
    
    geiseres_lava:
      enabled: true
      altura_min: 6
      altura_max: 12
      advertencia_ticks: 50  # 2.5s
      duracion_ticks: 180  # 9s
      damage: 2.5
      aplicar_fire: true
    
    rocas_volcanicas:
      enabled: true
      min_rocas: 4
      max_rocas: 7
      intervalo_ticks: 200  # 10s
      explosion_power: 1.7
      radio_fuego: 3
      material: "MAGMA_BLOCK"
    
    grietas_magmaticas:
      enabled: true
      longitud_min: 5
      longitud_max: 9
      profundidad_min: 2
      profundidad_max: 4
      max_activas: 7
      advertencia_ticks: 40  # 2s
      lava_permanente: true
    
    ceniza_volcanica:
      enabled: true
      intervalo_ticks: 500  # 25s
      radio: 17
      nausea_level: 2
      nausea_duration_ticks: 100  # 5s
      blindness_level: 1
      blindness_duration_ticks: 80  # 4s
      particle_count: 650
    
    bombas_magma:
      enabled: true
      solo_en_pico: true
      intervalo_ticks: 350  # 17.5s
      explosion_power: 2.5
      radio_fuego: 3
      duracion_fuego_ticks: 400  # 20s
    
    temblores_previos:
      enabled: true
      duracion_ticks: 100  # 5s
      intensidad_vibration: 0.15
    
    proteccion:
      bloques_resistentes:
        enabled: true
        obsidiana_inmune: true
        piedra_reduccion: 0.60
        materiales_resistentes:
          - "OBSIDIAN"
          - "CRYING_OBSIDIAN"
          - "STONE"
          - "COBBLESTONE"
          - "DEEPSLATE"
          - "BLACKSTONE"
      
      water_buckets:
        solidificar_lava: true
        geiser_rompe_agua_chance: 0.20
      
      altura_elevada:
        altura_minima: 10
        inmunidad_grietas: true
        reduccion_damage_rocas: 0.40
      
      bloques_hielo:
        enabled: true
        radio_efecto: 3
        reduccion_geiser: 0.50
        materiales:
          - "BLUE_ICE"
          - "PACKED_ICE"
    
    fases:
      enabled: true

common:
  random_damage:
    enabled: true
    chance: 0.15
    min_hearts: 0.5
    max_hearts: 1.5
    sound: "ENTITY_PLAYER_HURT"

# [1.21.8] Efectos por jugador al completar TODAS sus misiones del día
efectos_al_completar_mis_misiones:
  enabled: true
  title: "&b&l¡Misiones del día listas!"
  subtitle: "&7Completaste todas tus misiones"
  title_stay_ticks: 50
  particle: "VILLAGER_HAPPY"
  particle_count: 60
  particle_spread:
    x: 0.6
    y: 1.0
    z: 0.6
  sound_player: "PLAYER_LEVELUP"
  sound_volume: 1.0
  sound_pitch: 1.1
  fireworks: 2
  fireworks_power: 1
  # Opcional: comandos que se ejecutan SOLO al jugador (placeholder %player%)
  commands_on_complete:
    - "tellraw %player% {\"text\":\"¡Eres una máquina, %player%!\",\"color\":\"aqua\"}"

# ═══════════════════════════════════════════════════════════════════
# EXCEPCIONES - Jugadores inmunes a efectos de desastres
# ═══════════════════════════════════════════════════════════════════
excepciones:
  enabled: true
  players: []  # UUIDs en string; acepta nombres pero convierte a UUID

# ════════════════════════════════════════════════════════════════════
# CONFIGURACIÓN ANTI-CHEAT COMPATIBILITY
# ════════════════════════════════════════════════════════════════════
anti_cheat:
  # Habilitar sistema de velocity smoothing
  velocity_smoothing_enabled: true
  
  # Velocidad máxima por tick (valores seguros)
  # Conservador: 0.10, Balanceado: 0.15, Agresivo: 0.20
  max_velocity_per_tick: 0.15
  
  # Duración de aplicación suave (ticks)
  # Mayor duración = más suave pero menos realismo
  # Conservador: 8, Balanceado: 5, Agresivo: 3
  smooth_duration_ticks: 5
  
  # Reducir empuje durante lag (TPS < threshold)
  reduce_on_lag: true
  lag_threshold_tps: 18.0
  lag_reduction_factor: 0.5
