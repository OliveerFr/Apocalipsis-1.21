# ════════════════════════════════════════════════════════════════════
# Apocalipsis — chat.yml
# Sistema de chat mejorado con formato visual basado en rangos
# ════════════════════════════════════════════════════════════════════

version: 1
enabled: true

# ═══════════════════════════════════════════════════════════════════
# CONFIGURACIÓN GENERAL
# ═══════════════════════════════════════════════════════════════════
general:
  # Distancia máxima para chat local (0 = global, >0 = local)
  chat_radius: 0
  
  # Permitir colores en mensajes para ciertos rangos
  allow_colors:
    NOVATO: false
    EXPLORADOR: false
    SOBREVIVIENTE: true
    VETERANO: true
    LEYENDA: true
    MAESTRO: true
    TITAN: true
    ABSOLUTO: true
  
  # Permitir formato (bold, italic, etc.) para ciertos rangos
  allow_formatting:
    NOVATO: false
    EXPLORADOR: false
    SOBREVIVIENTE: false
    VETERANO: true
    LEYENDA: true
    MAESTRO: true
    TITAN: true
    ABSOLUTO: true
  
  # Cooldown entre mensajes (segundos) para evitar spam
  message_cooldown:
    NOVATO: 2.0
    EXPLORADOR: 1.5
    SOBREVIVIENTE: 1.0
    VETERANO: 0.5
    LEYENDA: 0.3
    MAESTRO: 0.0
    TITAN: 0.0
    ABSOLUTO: 0.0

# ═══════════════════════════════════════════════════════════════════
# FORMATOS DE CHAT POR RANGO
# ═══════════════════════════════════════════════════════════════════
# Variables disponibles:
#   %player% - Nombre del jugador
#   %level% - Nivel del jugador
#   %message% - Mensaje del jugador
#   %rank% - Nombre del rango
# ═══════════════════════════════════════════════════════════════════

formats:
  NOVATO:
    # Formato: [Novato] NombreJugador [Nv.5] » mensaje
    badge: "&8[&aNovato&8]"
    player_name: "&a%player%"
    level_badge: "&8[&7Nv.%level%&8]"
    separator: "&8»"
    message_color: "&f"
    
  EXPLORADOR:
    # Formato: [✦ Explorador] NombreJugador [Nv.10] » mensaje
    badge: "&8[&b✦ Explorador&8]"
    player_name: "&b%player%"
    level_badge: "&8[&3Nv.%level%&8]"
    separator: "&8»"
    message_color: "&f"
    
  SOBREVIVIENTE:
    # Formato: [⚔ Sobreviviente] NombreJugador [Nv.15] » mensaje
    badge: "&8[&e⚔ Sobreviviente&8]"
    player_name: "&e%player%"
    level_badge: "&8[&6Nv.%level%&8]"
    separator: "&8»"
    message_color: "&f"
    
  VETERANO:
    # Formato: [★ Veterano] NombreJugador [Lv.20] » mensaje
    badge: "&8[&6★ Veterano&8]"
    player_name: "&6%player%"
    level_badge: "&8[&eLv.%level%&8]"
    separator: "&7»"
    message_color: "&f"
    
  LEYENDA:
    # Formato: [★★ LEYENDA] NombreJugador [Lv.25] » mensaje
    badge: "&8[&c★★ &l&cLEYENDA&8]"
    player_name: "&c&l%player%"
    level_badge: "&r&8[&cLv.%level%&8]"
    separator: "&c»"
    message_color: "&f"
    
  MAESTRO:
    # Formato: [♛ MAESTRO] NombreJugador [Lv.30] » mensaje
    badge: "&8[&5♛ &l&5MAESTRO&8]"
    player_name: "&5&l%player%"
    level_badge: "&r&8[&dLv.%level%&8]"
    separator: "&5»"
    message_color: "&f"
    
  TITAN:
    # Formato: [✦TITÁN✦] NombreJugador [Lv.35] » mensaje
    badge: "&8[&4✦&l&4TITÁN&r&4✦&8]"
    player_name: "&4&l%player%"
    level_badge: "&r&8[&cLv.%level%&8]"
    separator: "&4»"
    message_color: "&f"
    
  ABSOLUTO:
    # Formato: [◈ ABSOLUTO ◈] NombreJugador [Lv.40] » mensaje
    badge: "&8[&f&l◈ ABSOLUTO ◈&8]"
    player_name: "&f&l%player%"
    level_badge: "&r&8[&fLv.%level%&8]"
    separator: "&f»"
    message_color: "&7"

# ═══════════════════════════════════════════════════════════════════
# MENSAJES ESPECIALES
# ═══════════════════════════════════════════════════════════════════
special_messages:
  # Mensaje cuando un jugador intenta usar colores sin permiso
  no_color_permission: "&cNo puedes usar colores en el chat aún. Alcanza el rango Sobreviviente."
  
  # Mensaje cuando un jugador está en cooldown
  cooldown_message: "&cEspera %seconds%s antes de enviar otro mensaje."
  
  # Prefijo para mensajes del sistema en chat
  system_prefix: "&8[&6Sistema&8]"

# ═══════════════════════════════════════════════════════════════════
# FILTROS Y MODERACIÓN
# ═══════════════════════════════════════════════════════════════════
moderation:
  # Bloquear palabras (lista de palabras prohibidas)
  blocked_words_enabled: false
  blocked_words: []
  
  # Límite de mayúsculas (% del mensaje)
  max_caps_percentage: 70
  caps_warning: "&eEvita escribir todo en MAYÚSCULAS."
  
  # Anti-spam (mensajes repetidos)
  anti_spam_enabled: true
  spam_warning: "&cNo envíes el mismo mensaje repetidamente."

# ═══════════════════════════════════════════════════════════════════
# MENCIONES Y NOTIFICACIONES
# ═══════════════════════════════════════════════════════════════════
mentions:
  enabled: true
  # Color cuando alguien menciona tu nombre
  mention_color: "&e&l"
  # Sonido al ser mencionado
  mention_sound: "BLOCK_NOTE_BLOCK_PLING"
  mention_volume: 0.8
  mention_pitch: 1.5

# ═══════════════════════════════════════════════════════════════════
# CANALES DE CHAT (Futuro)
# ═══════════════════════════════════════════════════════════════════
channels:
  enabled: false
  default_channel: "global"
  available_channels:
    - global
    - local
    - admin
