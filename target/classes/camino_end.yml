# ═══════════════════════════════════════════════════════════════════
# EL CAMINO AL END - Mini-evento de Exploración
# ═══════════════════════════════════════════════════════════════════
# Evento de exploración y descubrimiento de 2-3 horas
# Inicio manual con: /avo evento4 start o /avo caminoend start
# ═══════════════════════════════════════════════════════════════════

metadata:
  event_id: "camino_end"
  nombre_display: "§5§lEl Camino al End"
  version: "1.0.0"
  enabled: true
  duracion_total_seg: 9000  # 2.5 horas máximo (150 minutos)
  jugadores_minimos: 1
  jugadores_maximos: 20
  descripcion: "Anomalías dimensionales aparecen en el mundo. El Observador percibe la resonancia de una dimensión lejana."

# ═══════════════════════════════════════════════════════════════════
# INFORMACIÓN DEL EVENTO
# ═══════════════════════════════════════════════════════════════════
evento:
  nombre_display: "§5§lEl Camino al End"
  descripcion: "Anomalías dimensionales aparecen en el mundo..."
  tipo: "exploracion"
  combate: false
  colaborativo: true

# ═══════════════════════════════════════════════════════════════════
# SISTEMA DE FASES - 3 Fases Progresivas
# ═══════════════════════════════════════════════════════════════════
fases:
  anomalias:
    nombre: "Anomalías Dimensionales"
    duracion_min_ticks: 36000      # 30 minutos mínimo
    duracion_max_ticks: 54000      # 45 minutos máximo
    
    clima:
      tipo: "end_atmosphere"       # Atmósfera del End (sin lluvia)
      cielo_despejado: true
      tiempo: 13000                # Atardecer violeta
      particulas_cielo: true       # Partículas violeta en el cielo
    
    anomalia_spawn:
      intervalo_ticks: 200         # Cada 10 segundos intento de spawn
      max_simultaneas: 8
      distancia_minima_spawn: 150  # Distancia mínima entre anomalías
      radio_jugador_min: 100       # Radio mínimo desde jugador
      radio_jugador_max: 300       # Radio máximo desde jugador
      
      estructura_end:              # Bloques de End en anomalías
        plataforma: "END_STONE"    # Plataforma base 3x3
        pilares: "PURPUR_PILLAR"   # Pilares decorativos
        bloques_flotantes: true    # End Rods flotantes
    
    entidades:                     # Sistema de spawneo de entidades
      guardian_vacio:              # Enderman en anomalías INESTABLES
        tipo: "ENDERMAN"
        nombre: "§5§lGuardián del Vacío"
        cantidad: 1
        acompañantes:
          tipo: "ENDERMITE"
          nombre: "§7§oParásito del Vacío"
          cantidad_min: 1
          cantidad_max: 3
      
      drops:                       # Sistema de drops con probabilidad
        guardian:
          fragmentos_vacio:        # SIEMPRE
            cantidad_min: 2
            cantidad_max: 4
            probabilidad: 100
          perlas_ender:            # SIEMPRE
            cantidad_min: 1
            cantidad_max: 3
            probabilidad: 100
          espada_vacio:            # Items únicos con probabilidad
            probabilidad: 30
            encantamientos: "Sharpness IV, Knockback II, Looting I"
          pico_vacio:
            probabilidad: 25
            encantamientos: "Efficiency IV, Fortune II, Unbreaking III"
          escudo_dimensional:
            probabilidad: 20
            encantamientos: "Unbreaking III, Mending"
          casco_observador:
            probabilidad: 15
            encantamientos: "Protection IV, Unbreaking III, Respiration III, Aqua Affinity"
        
        endermite:
          fragmento_vacio:
            cantidad: 1
            probabilidad: 50
          polvo_vacio:
            cantidad: 1
            probabilidad: 15
    
    efectos_visuales:
      particulas_espiral:
        tipo: "END_ROD"
        cantidad: 3
        radio: 0.5
        frecuencia_ticks: 2
      
      particulas_base:
        tipo: "PORTAL"
        cantidad: 5
        radio: 0.3
        frecuencia_ticks: 2
    
    efectos_sonoros:
      beacon_ambient:
        sound: "BLOCK_BEACON_AMBIENT"
        volumen: 0.3
        pitch: 0.8
        intervalo_ticks: 100        # Cada 5 segundos
      
      portal_ambient:
        sound: "BLOCK_PORTAL_AMBIENT"
        volumen: 0.2
        pitch: 1.2
        intervalo_ticks: 100
    
    timeout_segundos: 300           # Anomalías desaparecen tras 5 minutos sin interacción
  
  resonancia:
    nombre: "La Resonancia"
    transicion: "automatica"        # Transición automática tras duración de anomalías
    duracion: "larga"               # Fase más larga (30-45 min)
    
    fragmentos:
      objetivo_global: 40           # Total de fragmentos a recolectar
      radio_recoleccion: 3.0        # Distancia para recolectar (bloques)
      una_vez_por_anomalia: true    # Solo 1 fragmento por anomalía
    
    progreso:
      anuncio_cada: 5               # Anunciar cada 5 fragmentos
      anuncio_global: true
      formato: "§7[§5✦§7] §fFragmento recolectado: §e%actual%§7/§e%total% §7(§a%porcentaje%%§7)"
    
    # ═══════════════════════════════════════════════════════════════
    # SISTEMA DE HORDAS (FASE 2)
    # ═══════════════════════════════════════════════════════════════
    hordas:
      activado: true
      intervalo_min_ticks: 6000     # 5 minutos mínimo entre hordas
      intervalo_max_ticks: 12000    # 10 minutos máximo entre hordas
      
      tipos:
        brutos_vacio:                # 40% de probabilidad
          probabilidad: 40
          nombre: "§c§oBrutos del Vacío"
          entidades:
            - tipo: "PIGLIN_BRUTE"
              cantidad_min: 3
              cantidad_max: 5
              nombre: "§c§lBruto del Vacío"
              immune_zombificacion: true
          drops:
            fragmento_vacio:
              probabilidad: 40
            oro:
              probabilidad: 20
              cantidad_min: 3
              cantidad_max: 8
            espada_oro:
              probabilidad: 10
              encantamientos: "Sharpness III, Knockback II"
        
        ciudadanos_end:              # 30% de probabilidad
          probabilidad: 30
          nombre: "§5§oCiudadanos del End"
          entidades:
            - tipo: "ENDERMAN"
              cantidad_min: 4
              cantidad_max: 7
              nombre: "§5§lCiudadano del End"
          drops:
            fragmento_vacio:
              probabilidad: 35
            perlas_ender:
              probabilidad: 100
              cantidad_min: 1
              cantidad_max: 2
        
        legion_vacio:                # 30% de probabilidad (HORDA MIXTA)
          probabilidad: 30
          nombre: "§4§oLegión del Vacío"
          entidades:
            - tipo: "PIGLIN_BRUTE"
              cantidad: 2
              nombre: "§c§lBruto de la Legión"
            - tipo: "ENDERMAN"
              cantidad: 3
              nombre: "§5§lTeleportador de la Legión"
            - tipo: "ENDERMITE"
              cantidad_min: 5
              cantidad_max: 8
              nombre: "§7Parásito de la Legión"
          drops:
            variados: true
    
    # ═══════════════════════════════════════════════════════════════
    # WARDEN - JEFE FINAL
    # ═══════════════════════════════════════════════════════════════
    warden:
      activado: true
      spawn_fragmentos_min: 35      # Aparece entre fragmento 35-39
      proximidad_jugador: 20.0      # Radio de detección (bloques)
      
      stats:
        nombre: "§4§l☠ GUARDIÁN DEL VACÍO ABSOLUTO ☠"
        salud: 1000.0                # 500 corazones
        daño_ataque: 40.0            # 20 corazones por golpe
        resistencia_retroceso: 1.0   # Inmune a knockback
      
      mecanica_distancia:
        activado: true
        radio_maximo: 100.0          # Si todos se alejan >100 bloques
        despawn_si_lejos: true       # Se despawnea si se alejan
        excepcion_fragmento_40: true # En fragmento 40 NO se despawnea
      
      fragmento_40:
        obligatorio_matar: true      # DEBE matarse al Warden para fragmento 40
        mensaje: "§c§l⚠ EL GUARDIÁN DEBE SER DERROTADO ⚠"
        bloquea_transicion: true     # No permite pasar a REVELACION sin matarlo
      
      drops:
        garantizados:
          corazon_vacio:             # Item legendario único
            tipo: "ECHO_SHARD"
            nombre: "§5§l◆ CORAZÓN DEL VACÍO ABSOLUTO ◆"
            encantamiento_visual: "Protection X"
          fragmentos_vacio:
            cantidad_min: 10
            cantidad_max: 15
          escombros_antiguos:
            cantidad_min: 8
            cantidad_max: 16
          diamantes:
            cantidad_min: 16
            cantidad_max: 32
        
        probabilisticos:
          espada_guardian:           # 80% - Netherite Sword
            probabilidad: 80
            encantamientos: "Sharpness V, Looting III, Knockback II, Fire Aspect II, Unbreaking III"
          hacha_guardian:            # 70% - Netherite Axe
            probabilidad: 70
            encantamientos: "Sharpness V, Efficiency V, Fortune II, Unbreaking III"
          peto_guardian:             # 60% - Netherite Chestplate
            probabilidad: 60
            encantamientos: "Protection V, Unbreaking III, Mending, Knockback Resistance"
          pantalones_guardian:       # 50% - Netherite Leggings
            probabilidad: 50
            encantamientos: "Protection IV, Projectile Protection III, Unbreaking III, Mending"
    
    # ═══════════════════════════════════════════════════════════════
    # EFECTOS VISUALES (FASE 2)
    # ═══════════════════════════════════════════════════════════════
    efectos_visuales:
      darkness:
        activado: true
        fragmentos_min: 30           # A partir de 30 fragmentos
        probabilidad: 0.3            # 30% cada aplicación
        duracion_ticks: 80           # 4 segundos
        nivel: 0
      
      particulas_progresivas:
        inicio:                      # 0-20 fragmentos
          portal:
            cantidad: 5
            radio: 1.0
          reverso_portal:
            cantidad: 0
        
        mitad:                       # 20-30 fragmentos
          portal:
            cantidad: 15
            radio: 2.0
          reverso_portal:
            cantidad: 8
            radio: 1.5
        
        final:                       # 30-40 fragmentos
          portal:
            cantidad: 0
          sculk_soul:
            cantidad: 10
            radio: 3.0
          soul:
            cantidad: 5
            radio: 2.0
      
      sonidos_ambiente:
        enderman_ambient:
          probabilidad: 0.2
          volumen: 0.2
          pitch: 0.7
  
  revelacion:
    nombre: "La Revelación"
    trigger: "fragmentos_objetivo"  # Inicia al alcanzar 40 fragmentos
    duracion_max_ticks: 36000      # Máximo 30 minutos en revelación
    
    portal:
      auto_generar: true
      buscar_suelo: true         # Busca suelo seguro automáticamente
      ubicacion:
        # Ubicación predefinida (opcional, si no se define usa spawn del mundo)
        world: "world"
        x: 0
        y: -1                    # -1 = buscar suelo automáticamente
        z: 0
      
      estructura:
        tipo: "incompleto_epico"
        tamaño: "9x9"                # Portal épico más grande
        bloques_totales: 28          # 28 frames en total (7 por lado)
        bloques_colocados: 14        # 14 de 28 bloques (50% incompleto)
        material_frame: "END_PORTAL_FRAME"
        material_base: "END_STONE_BRICKS"
        material_pilares: "PURPUR_PILLAR"
        plataforma_size: "11x11"     # Plataforma épica
      
      efectos:
        particulas_portal:
          tipo: "PORTAL"
          cantidad: 40             # Más partículas
          radio: 3.5               # Radio más amplio
          frecuencia_ticks: 2
        
        particulas_portal_reverso:
          tipo: "REVERSE_PORTAL"
          cantidad: 25
          radio: 3.0
          frecuencia_ticks: 2
        
        particulas_espiral:
          tipo: "END_ROD"
          cantidad: 16             # Espiral más densa
          radio: 4.0               # Radio más amplio
          altura_max: 12.0         # Espiral más alta
          frecuencia_ticks: 2
        
        anillo_dragon:
          tipo: "DRAGON_BREATH"
          cantidad: 32
          radio: 5.5
          frecuencia_ticks: 2
        
        pulsos_energia:
          tipo: "SOUL"
          cantidad: 50
          radio: 4.0
          intervalo_ticks: 80      # Cada 4 segundos

# ═══════════════════════════════════════════════════════════════════
# MENSAJES DEL EVENTO
# ═══════════════════════════════════════════════════════════════════
mensajes:
  inicio:
    titulo: "§5§l⚡ EL CAMINO AL END"
    subtitulo: "§7Ecos antiguos resuenan; anomalías vuelven a despertar..."
    
    mensajes:
      - "§8§m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "§5§l⚡ EL OBSERVADOR:"
      - "§7§o\"Escuchen... el eco de lo que ya vivimos...\""
      - "§7§o\"Los brasas susurraron primero... §cEco de Brasas...\""
      - "§7§o\"Luego, las sombras respondieron... §8Eco de Sombras...\""
      - "§7§o\"La piedra rota habló... §7Susurro de la Piedra...\""
      - "§7§o\"Incluso en tiempos de luz... §aNavidad... algo observaba.\""
      - ""
      - "§7Todo eso no terminó. §fContinúa aquí, ahora."
      - "§7La resonancia del vacío está más cerca que nunca."
      - "§7Donde aparezcan §dAnomalías, hay §5Fragmentos del Vacío."
      - "§7Acércate con cuidado; recolecta lo que no debería estar."
      - "§8§m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    delay_entre_mensajes: 20        # Ticks entre cada mensaje (1 segundo)
  
  fase_resonancia:
    observador: "§5§l⚡ EL OBSERVADOR:"
    mensaje: "§7§o\"Las barreras... se debilitan...\""
    mensaje2: "§7§o\"Ahora... puedo sentir los fragmentos...\""
    sound: "BLOCK_SCULK_SENSOR_CLICKING"
    volumen: 0.5
    pitch: 1.0
    titulo: "§d§l⚡ FASE II: RESONANCIA ⚡"
    subtitulo: "§7§oRecolecten los fragmentos del vacío"
    mensajes_extra:
      - "§7§o\"Los ecos de Brasas, Sombras y Piedra... convergen.\""
      - "§7§o\"Cada anomalía... oculta §5fragmentos§7 que no deberían estar...\""
  
  fase_revelacion:
    observador: "§5§l⚡ EL OBSERVADOR:"
    mensaje: "§7§o\"Suficiente... la puerta se abre... incompleta...\""
    
    titulo: "§5§l⚡ REVELACIÓN"
    subtitulo: "§7Un portal incompleto se revela..."
    
    sound: "ENTITY_ENDER_DRAGON_GROWL"
    volumen: 1.0
    pitch: 0.5
  
  finalizacion:
    observador: "§5§l⚡ EL OBSERVADOR:"
    mensajes:
      - "§7§o\"El camino... aún no está completo...\""
      - "§7§o\"Pero ahora sabemos... que existe.\""
  
  fragmento_recolectado:
    jugador:
      - "§5§l⚡ EL OBSERVADOR:"
      - "§7§o\"Un fragmento... resuena en tus manos...\""
    
    global: "§7[§5✦§7] §fFragmento recolectado: §e%actual%§7/§e%total% §7(§a%porcentaje%%§7)"
    
    sound: "BLOCK_SCULK_SENSOR_CLICKING"
    volumen: 0.5
    pitch: 1.2
  
  portal_interaccion:
    - "§5§l⚡ EL OBSERVADOR:"
    - "§7§o\"El portal... incompleto... no lleva a ningún lugar.\""
    - "§7§o\"Aún faltan piezas... pero ahora sabemos...\""
    - "§7§o\"...que el camino existe.\""

# ═══════════════════════════════════════════════════════════════════
# ITEMS DEL EVENTO
# ═══════════════════════════════════════════════════════════════════
items:
  fragmento_vacio:
    material: "AMETHYST_SHARD"
    nombre: "§5Fragmento del Vacío"
    lore:
      - "§7Un cristal que resuena con"
      - "§7energía dimensional extraña."
      - ""
      - "§7Emite un zumbido suave y"
      - "§7partículas púrpuras ocasionales."
      - ""
      - "§5§o\"Algo llama desde el vacío...\""
    
    enchant_glow: true
    flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
  
  marca_observador:
    material: "NETHER_STAR"
    nombre: "§5§l⚡ Marca del Observador"
    lore:
      - "§7Recompensa del Camino al End"
      - ""
      - "§dUna marca dimensional que prueba"
      - "§dque exploraste lo desconocido."
      - ""
      - "§7El Observador reconoce tu valentía"
      - "§7al acercarte a lo que no debería estar."
      - ""
      - "§5§o\"El camino existe... aunque incompleto.\""
    
    enchant_glow: true
    flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"
  
  brujula_vacio:
    material: "RECOVERY_COMPASS"
    nombre: "§5Brújula del Vacío"
    lore:
      - "§7Una brújula que apunta hacia"
      - "§7las anomalías dimensionales."
      - ""
      - "§7Gira erráticamente cuando"
      - "§7hay una anomalía cerca."
      - ""
      - "§5§o\"Busca lo que no pertenece...\""
    
    enchant_glow: true
    flags:
      - "HIDE_ENCHANTS"
      - "HIDE_ATTRIBUTES"

# ═══════════════════════════════════════════════════════════════════
# RECOMPENSAS
# ═══════════════════════════════════════════════════════════════════
recompensas:
  ps_base: 150                      # PS base por participar
  ps_por_fragmento: 5               # PS adicional por cada fragmento recolectado
  
  # Bonos para top 3 recolectores
  bono_top1: 300                    # Bono adicional para el 1º puesto
  bono_top2: 200                    # Bono adicional para el 2º puesto
  bono_top3: 100                    # Bono adicional para el 3º puesto
  
  items_especiales:
    marca_observador:
      dar_a: "todos_participantes"
      cantidad: 1
    
    fragmentos_extra:
      dar_a: "top_recolectores"     # Top 3 recolectores
      cantidad: 10
  
  titulo:
    texto: "§5El Explorador del Vacío"
    dar_a: "todos_participantes"

# ═══════════════════════════════════════════════════════════════════
# CONFIGURACIÓN AVANZADA
# ═══════════════════════════════════════════════════════════════════
configuracion:
  debug: false
  logs_detallados: false
  
  performance:
    max_anomalias_render: 8         # Máximo de anomalías renderizando partículas
    reducir_particulas_tps_bajo: true
    tps_umbral: 18.0
  
  mundo:
    mundos_permitidos:
      - "world"
    
    biomas_excluidos:              # No spawnear anomalías en estos biomas
      - "OCEAN"
      - "DEEP_OCEAN"
      - "RIVER"
  
  proteccion:
    portal_indestructible: true
    anomalias_indestructibles: true
