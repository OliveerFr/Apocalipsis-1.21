# ═══════════════════════════════════════════════════════════════
# HABILIDADES PASIVAS POR RANGO (REBALANCEADAS v1.22.64)
# Las habilidades se activan automáticamente al tener el rango
# Sistema progresivo: Cada rango añade nuevos efectos sin quitar los anteriores
# 
# ═══════════════════════════════════════════════════════════════
# FILOSOFÍA DEL REBALANCEO:
# ═══════════════════════════════════════════════════════════════
# ❌ REMOVIDAS (muy OP o en skill tree):
#    - Night Vision: COMPRABLE en árbol (rama Exploración, 400 XP)
#    - Dolphin's Grace: COMPRABLE como NADADOR (rama Supervivencia)
#    - Saturation: Demasiado OP (elimina mecánica de hambre)
#    - Hero of Village: Muy situacional (poco útil)
#
# ✅ AÑADIDAS (más útiles y balanceadas):
#    - Water Breathing: Exploración acuática ilimitada
#    - Speed: Movilidad general mejorada
#    - Fire Resistance: Seguridad en Nether
#
# 🎯 PROGRESIÓN BALANCEADA:
#    NOVATO      → Sin habilidades (inicio limpio)
#    EXPLORADOR  → Luck I (mejor loot)
#    SOBREVIVIENTE → +Water Breathing (océanos/minas inundadas)
#    VETERANO    → +Speed I (movilidad básica)
#    LEYENDA     → Luck II, +Fire Resistance (Nether seguro)
#    MAESTRO     → +Resistance I (defensa física)
#    TITAN       → Speed II, +Strength I (combate mejorado)
#    ABSOLUTO    → Luck III, Resistance II, +Absorption I (tope)
# ═══════════════════════════════════════════════════════════════

habilidades_por_rango:
  # Perdido (Novato) - El inicio del viaje
  NOVATO:
    habilidades: []
      # Sin habilidades automáticas - los jugadores empiezan limpios
      # Deben comprar habilidades con XP en el árbol de skills
    
  # Despertar (Explorador) - Primeros pasos hacia el poder
  EXPLORADOR:
    habilidades:
      - type: "LUCK"
        level: 1
        descripcion: "&aSuerte I &7(Mejor loot de cofres y mobs)"
    
  # Resistente (Sobreviviente) - Exploración acuática
  SOBREVIVIENTE:
