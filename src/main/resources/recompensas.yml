        descripcion: "&aSuerte I"
      - type: "WATER_BREATHING"
        level: 1
        descripcion: "&bRespiración Acuática"
      - type: "SPEED"
        level: 1
        descripcion: "&eVelocidad I &7(Te mueves más rápido)"
    
  # Ascendido (Leyenda) - Protección elemental
  LEYENDA:
    habilidades:
      - type: "LUCK"
        level: 2
        descripcion: "&aSuerte II &6(¡Upgrade! Mejor loot)"
      - type: "WATER_BREATHING"
        level: 1
        descripcion: "&bRespiración Acuática"
      - type: "SPEED"
        level: 1
        descripcion: "&eVelocidad I"
      - type: "FIRE_RESISTANCE"
        level: 1
        descripcion: "&cResistencia al Fuego &7(El Nether es más seguro)"
    
  # Iluminado (Maestro) - Defensa mejorada
  MAESTRO:
    habilidades:
      - type: "LUCK"
        level: 2
        descripcion: "&aSuerte II"
      - type: "WATER_BREATHING"
        level: 1
        descripcion: "&bRespiración Acuática"
      - type: "SPEED"
        level: 1
        descripcion: "&eVelocidad I"
      - type: "FIRE_RESISTANCE"
        level: 1
        descripcion: "&cResistencia al Fuego"
      - type: "RESISTANCE"
        level: 1
        descripcion: "&6Resistencia I &7(Reduces el daño recibido)"
    
  # Trascendente (Titan) - Guerrero poderoso
  TITAN:
    habilidades:
      - type: "LUCK"
        level: 2
        descripcion: "&aSuerte II"
      - type: "WATER_BREATHING"
        level: 1
        descripcion: "&bRespiración Acuática"
      - type: "SPEED"
        level: 2
        descripcion: "&eVelocidad II &6(¡Upgrade! Movilidad superior)"
      - type: "FIRE_RESISTANCE"
        level: 1
        descripcion: "&cResistencia al Fuego"
      - type: "RESISTANCE"
        level: 1
        descripcion: "&6Resistencia I"
      - type: "STRENGTH"
        level: 1
        descripcion: "&4Fuerza I &7(Golpeas más fuerte en combate)"
    
  # Eterno (Absoluto) - El poder definitivo (pero balanceado)
