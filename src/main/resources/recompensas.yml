# ═══════════════════════════════════════════════════════════════
# HABILIDADES PASIVAS POR RANGO (BALANCEADAS)
# Las habilidades se activan automáticamente al tener el rango
# ═══════════════════════════════════════════════════════════════

habilidades_por_rango:
  # Novato - Sin habilidades especiales
  NOVATO:
    habilidades: []
    
  # Explorador - Bonus leve de velocidad
  EXPLORADOR:
    habilidades:
      - type: "SPEED"
        level: 1                 # Speed I permanente
        descripcion: "&bVelocidad I &7permanente"
    
  # Sobreviviente - Regeneración leve + mantiene speed
  SOBREVIVIENTE:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 1                 # Regeneration I permanente
        descripcion: "&eRegeneración I &7permanente"
    
  # Veterano - Resistencia añadida
  VETERANO:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 1
        descripcion: "&eRegeneración I &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1                 # Resistance I permanente
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"       # No pierde hambre tan rápido
        level: 1
        descripcion: "&aSaciedad mejorada"
    
  # Leyenda - Fuerza añadida, Regen II
  LEYENDA:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 2                 # Regeneration II (antes en Maestro)
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1                 # Strength I permanente
        descripcion: "&cFuerza I &7permanente"
    
  # Maestro - Speed II, Haste I
  MAESTRO:
    habilidades:
      - type: "SPEED"
        level: 2                 # Speed II (upgrade)
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 2
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1                 # Resistance I (antes II)
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1
        descripcion: "&cFuerza I &7permanente"
      - type: "FAST_DIGGING"     # Haste I permanente
        level: 1
        descripcion: "&7Prisa I &7permanente"
    
  # Titan - Resistance II, Haste II, Health Boost V
  TITAN:
    habilidades:
      - type: "SPEED"
        level: 2
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 2                 # Regen II (antes III, más balanceado)
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 2                 # Resistance II (upgrade)
        descripcion: "&6Resistencia II &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1                 # Strength I (antes II, más balanceado)
        descripcion: "&cFuerza I &7permanente"
      - type: "FAST_DIGGING"
        level: 2                 # Haste II (upgrade)
        descripcion: "&7Prisa II &7permanente"
      - type: "HEALTH_BOOST"     # +10 corazones permanentes
        level: 5
        descripcion: "&4Vida extra (+10 ❤)"
    
  # Absoluto - El máximo poder (pero balanceado)
  ABSOLUTO:
    habilidades:
      - type: "SPEED"
        level: 2
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 3                 # Regen III (antes IV, más balanceado)
        descripcion: "&eRegeneración III &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 2                 # Resistance II (antes III, más balanceado)
        descripcion: "&6Resistencia II &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 2                 # Strength II
        descripcion: "&cFuerza II &7permanente"
      - type: "FAST_DIGGING"
        level: 2
        descripcion: "&7Prisa II &7permanente"
      - type: "HEALTH_BOOST"
        level: 10                # +20 corazones permanentes
        descripcion: "&4Vida extra (+20 ❤)"
      - type: "FIRE_RESISTANCE"  # Inmunidad al fuego
        level: 1
        descripcion: "&cResistencia al fuego"
      - type: "WATER_BREATHING"  # Respiración bajo agua
        level: 1
        descripcion: "&9Respiración acuática"
      - type: "NIGHT_VISION"     # Visión nocturna
        level: 1
        descripcion: "&7Visión nocturna"
      - type: "LUCK"             # Suerte I (nuevo)
        level: 1
        descripcion: "&asuerte I"

# Configuración de aplicación de habilidades
habilidades_config:
  # Intervalo de renovación de efectos (en ticks)
  # 600 ticks = 30 segundos (se renuevan antes de que expiren)
  intervalo_renovacion: 600
  
  # Duración de los efectos (en ticks)
  # 1200 ticks = 60 segundos
  duracion_efecto: 1200
  
  # Ocultar partículas de efectos
  ocultar_particulas: false
  
  # Mensaje al aplicar habilidades (al login o rank up)
  notificar_aplicacion: true
  mensaje_aplicacion: "&aHabilidades de rango &e%rango% &aaplicadas"

# ═══════════════════════════════════════════════════════════════
# NOTAS DE BALANCE - SISTEMA AJUSTADO PARA 2.5 MESES (75 DÍAS)
# ═══════════════════════════════════════════════════════════════
# - Las misiones dan ~1,000-1,200 XP/día (fuente principal 75-80%)
# - Matar mobs da ~1 XP/mob (~50-100 XP/día para jugadores activos)
# - Minado da ~0.5-4 XP/ore con cooldown 3s (~80-120 XP/día)
# - Farming/craft/pesca da ~50-80 XP/día con cooldowns incrementados
# Total jugador muy activo (24/7): ~1,400-1,500 XP/día → Lvl 50 en ~75 días ✨
# Total jugador activo (solo misiones + algo): ~1,100-1,300 XP/día → Lvl 50 en ~100 días ✨
# Total jugador casual (solo misiones): ~700-900 XP/día → Lvl 36-43 en ~100 días
# 
# CURVA DE PROGRESIÓN (2.5x más lenta que v1.14.x):
# - Formula XP: base 200 + (nivel * 150) [antes: base 140 + (nivel * 70)]
# - Nivel máximo aumentado: 50 (antes 35)
# - XP total necesario: 110,075 XP (antes 44,030 XP)
# - Tiempo objetivo: 75 días (antes 20-30 días)
# 
# ANTI-GRIND MECHANICS:
# - Cooldown minado: 3s (antes 0s) → Evita spam con Fortune/Silk Touch
# - XP mobs pasivos: 0 (antes 1) → Elimina farming de animales
# - XP reducido en general: -20% a -50% según fuente
# - Multiplicadores por rango reducidos: 1.15x max (antes 1.30x)
# 
# RECOMPENSAS ÉPICAS:
# - Subir de rango ahora es EVENTO memorable (cada ~7-15 días)
# - Recompensas +50% de valor (ej: 8 diamantes en vez de 5)
# - Items únicos añadidos (Dragon Egg, Beacons, etc.)
# - Habilidades pasivas más graduales pero no rotas
# 
# BALANCE PHILOSOPHY:
# El sistema incentiva hacer misiones pero permite progreso alternativo.
# Jugadores muy activos alcanzarán ABSOLUTO en ~75 días (objetivo cumplido).
# Jugadores activos tardarán ~100 días (3.3 meses).
# Jugadores casuales tardarán 5+ meses, pero seguirán progresando.
# ═══════════════════════════════════════════════════════════════
