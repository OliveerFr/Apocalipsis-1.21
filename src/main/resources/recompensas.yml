# RECOMPENSAS POR SUBIDA DE RANGO (REDISEÑADAS - MÁS ÉPICAS)
# Sistema de ascenso temático del caos - Cada rango es memorable
# ═══════════════════════════════════════════════════════════════

recompensas_por_rango:
  # Al alcanzar DESPERTAR (Explorador) (~Día 3-5) - El primer paso
  EXPLORADOR:
    comandos:
      - "ps give 15 %player%"                                # 1 bloque protección
      - "give %player% minecraft:diamond 6"
      - "give %player% minecraft:golden_apple 4"
      - "give %player% minecraft:iron_block 12"
      - "give %player% minecraft:ender_pearl 8"
    mensaje: "&a¡Has DESPERTADO! &7Tu viaje hacia el poder comienza..."
    
  # Al alcanzar RESISTENTE (Sobreviviente) (~Día 10-12) - La fortaleza
  SOBREVIVIENTE:
    comandos:
      - "ps give 15 %player%"                                # 1 bloque protección
      - "give %player% minecraft:diamond 12"
      - "give %player% minecraft:golden_apple 6"
      - "give %player% minecraft:ender_pearl 24"
      - "give %player% minecraft:enchanted_book 1"
      - "give %player% minecraft:iron_block 16"
    mensaje: "&b¡Eres RESISTENTE! &7El mundo no puede detenerte..."
    
  # Al alcanzar PERSEVERANTE (Veterano) (~Día 20-25) - La determinación
  VETERANO:
    comandos:
      - "ps give 15 %player% 2"                              # 2 bloques protección
      - "give %player% minecraft:diamond 20"
      - "give %player% minecraft:enchanted_golden_apple 2"
