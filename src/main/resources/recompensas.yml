# ════════════════════════════════════════════════════════════════════
# Apocalipsis — recompensas.yml
# Sistema de recompensas por subida de rango, configuración de XP
# y recompensas por completar misiones diarias
# ════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR COMPLETAR MISIONES INDIVIDUALES
# ═══════════════════════════════════════════════════════════════

recompensas_por_mision:
  enabled: true
  
  # Recompensas según dificultad de la misión
  por_dificultad:
    FACIL:
      # Probabilidad de recompensa (0.0 - 1.0) - BALANCEADO v1.15
      probabilidad: 0.15          # 15% de chance (reducido para balance)
      items:
        - "give %player% minecraft:bread 3"
        - "give %player% minecraft:cooked_beef 2"
      mensaje: "&a¡Bonus! &7+3 Pan, +2 Carne"
      
    MEDIA:
      probabilidad: 0.25          # 25% de chance (reducido para balance)
      items:
        - "give %player% minecraft:iron_ingot 3"
        - "give %player% minecraft:gold_ingot 1"
        - "give %player% minecraft:arrow 12"
      mensaje: "&a¡Bonus! &7+3 Hierro, +1 Oro, +12 Flechas"
      
    DIFICIL:
      probabilidad: 0.35          # 35% de chance (reducido para balance)
      items:
        - "give %player% minecraft:diamond 1"
        - "give %player% minecraft:golden_apple 1"
        - "give %player% minecraft:experience_bottle 4"
      mensaje: "&a¡Bonus! &7+1 Diamante, +1 Manzana Dorada, +4 XP Bottles"

# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR COMPLETAR TODAS LAS MISIONES DEL DÍA
# ═══════════════════════════════════════════════════════════════

recompensas_diarias_completas:
  enabled: true
  
  # Recompensas base (siempre se dan) - BALANCEADO v1.15
  recompensas_base:
    comandos:
      - "give %player% minecraft:diamond 4"              # Balanceado: 4 diamantes
      - "give %player% minecraft:golden_apple 2"         # Balanceado: 2 manzanas
      - "give %player% minecraft:experience_bottle 6"    # Balanceado: 6 bottles
      - "give %player% minecraft:iron_ingot 16"          # Agregado: recursos base
    mensaje: "&6&l★ ¡MISIONES DIARIAS COMPLETADAS! &r&7Has recibido recompensas especiales"
    
  # Recompensas adicionales según el rango del jugador
  bonus_por_rango:
    NOVATO:
      comandos:
        - "give %player% minecraft:iron_ingot 5"
      mensaje: "&a[Bonus Novato] &7+5 Lingotes de Hierro"
      
    EXPLORADOR:
      comandos:
        - "give %player% minecraft:iron_ingot 8"
        - "give %player% minecraft:ender_pearl 2"
      mensaje: "&b[Bonus Explorador] &7+8 Hierro, +2 Perlas de Ender"
      
    SOBREVIVIENTE:
      comandos:
        - "give %player% minecraft:diamond 2"
        - "give %player% minecraft:ender_pearl 4"
      mensaje: "&e[Bonus Sobreviviente] &7+2 Diamantes, +4 Perlas de Ender"
      
    VETERANO:
      comandos:
        - "give %player% minecraft:diamond 3"
        - "give %player% minecraft:netherite_scrap 1"
        - "give %player% minecraft:ender_pearl 6"
      mensaje: "&6[Bonus Veterano] &7+3 Diamantes, +1 Netherite Scrap, +6 Perlas"
      
    LEYENDA:
      comandos:
        - "give %player% minecraft:diamond 5"
        - "give %player% minecraft:netherite_scrap 2"
        - "give %player% minecraft:enchanted_golden_apple 1"
      mensaje: "&c[Bonus Leyenda] &7+5 Diamantes, +2 Scrap, +1 Manzana Encantada"
      
    MAESTRO:
      comandos:
        - "give %player% minecraft:netherite_ingot 1"
        - "give %player% minecraft:enchanted_golden_apple 2"
        - "give %player% minecraft:totem_of_undying 1"
      mensaje: "&5[Bonus Maestro] &7+1 Netherite, +2 Manzanas Encantadas, +1 Tótem"
      
    TITAN:
      comandos:
        - "give %player% minecraft:netherite_ingot 2"
        - "give %player% minecraft:enchanted_golden_apple 3"
        - "give %player% minecraft:nether_star 1"
      mensaje: "&4[Bonus Titán] &7+2 Netherite, +3 Manzanas Encantadas, +1 Estrella"
      
    ABSOLUTO:
      comandos:
        - "give %player% minecraft:netherite_ingot 3"
        - "give %player% minecraft:enchanted_golden_apple 5"
        - "give %player% minecraft:nether_star 2"
        - "give %player% minecraft:elytra 1"
      mensaje: "&f&l[Bonus Absoluto] &7+3 Netherite, +5 Manzanas Enc., +2 Estrellas, +1 Élitro"
  
  # Mensaje de celebración
  titulo: "&6&l¡COMPLETADO!"
  subtitulo: "&eHas terminado todas las misiones del día"
  
  # Efectos especiales
  efectos:
    fuegos_artificiales: 5      # Cantidad de fuegos artificiales
    particulas: true             # Mostrar partículas épicas
    sonidos: true                # Reproducir sonidos de victoria

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE EXPERIENCIA (XP)
# ═══════════════════════════════════════════════════════════════

# Fórmula para XP necesario por nivel: base + (nivel * multiplicador)
experiencia:
  nivel_inicial: 200           # XP necesario para nivel 2
  multiplicador: 150            # XP adicional por cada nivel

# ═══════════════════════════════════════════════════════════════
# SISTEMA DINÁMICO DE XP - MULTIPLICADORES Y BONIFICACIONES
# ═══════════════════════════════════════════════════════════════

xp_dinamico:
  verbose_logging: true         # Mostrar logs detallados en consola
  
  # ActionBar - Notificaciones visuales
  actionbar:
    enabled: true               # Mostrar XP ganado en ActionBar
  
  # ═══════════════════════════════════════════════════════════════
  # 🎮 SISTEMA DE PRESENCIA DEL STREAMER
  # XP normal cuando streameas, reducido cuando no estás
  # ═══════════════════════════════════════════════════════════════
  presencia_streamer:
    enabled: true
    
    # Usuario del streamer (cambia "Riolu" por tu username)
    streamer_username: "OliveerF"
    
    # Cuando el streamer está ONLINE = XP normal
    multiplicador_online: 1.0       # x1.0 = XP normal, sin cambios
    
    # Cuando el streamer está OFFLINE = XP reducido
    multiplicador_offline: 0.2      # x0.2 = 80% menos XP
    
    # Notificaciones
    notificar_conexion: true
    notificar_desconexion: true
    mensaje_conexion: "&6&l[STREAM] &e¡El streamer está ONLINE! &aXP normal restaurado"
    mensaje_desconexion: "&6&l[STREAM] &7El streamer se desconectó. &cXP reducido al 30%"
    
    # Título cuando te conectas
    titulo_conexion:
      enabled: true
      titulo: "&6&l⭐ STREAM ONLINE"
      subtitulo: "&eXP normal activado"
  
  # ═══════════════════════════════════════════════════════════════
  # 🎁 RECOMPENSAS PARA EL STREAMER - Logros y Hitos del Servidor
  # Las recompensas se acumulan en /recompensas para reclamarlas cuando quieras
  # ═══════════════════════════════════════════════════════════════
  recompensas_streamer:
    enabled: true
    
    # Usuario del streamer (recibe las recompensas)
    streamer_username: "OliveerF"
    
    # ═════════════════════════════════════════════════════════════
    # 👥 RECOMPENSAS POR JUGADORES NUEVOS
    # ═════════════════════════════════════════════════════════════
    jugador_nuevo:
      # Cuando un jugador NUEVO se une al servidor
      primer_join:
        titulo: "§6§l¡Jugador Nuevo!"
        descripcion: "§e%jugador% §7se unió por primera vez"
        xp: 300
        comandos:
          - "give %player% minecraft:diamond 3"
          - "give %player% minecraft:golden_apple 2"
        acumulable: true          # Se guarda en /recompensas
        
      # Cuando el jugador nuevo juega su primera hora
      primera_hora:
        titulo: "§a§l¡Primera Hora Completada!"
        descripcion: "§e%jugador% §7jugó su primera hora"
        xp: 200
        comandos:
          - "give %player% minecraft:diamond 2"
          - "give %player% minecraft:experience_bottle 5"
        acumulable: true
      
      # Cuando el jugador nuevo alcanza cada rango
      rangos:
        EXPLORADOR:
          titulo: "§b§l¡Explorador Alcanzado!"
          descripcion: "§e%jugador% §7alcanzó Explorador"
          xp: 500
          comandos:
            - "give %player% minecraft:diamond 5"
            - "give %player% minecraft:emerald 3"
        
        SOBREVIVIENTE:
          titulo: "§e§l¡Sobreviviente Alcanzado!"
          descripcion: "§e%jugador% §7alcanzó Sobreviviente"
          xp: 800
          comandos:
            - "give %player% minecraft:diamond 8"
            - "give %player% minecraft:netherite_scrap 1"
            - "ps give 15 %player% 5"
        
        VETERANO:
          titulo: "§6§l¡Veterano Alcanzado!"
          descripcion: "§e%jugador% §7alcanzó Veterano"
          xp: 1200
          comandos:
            - "give %player% minecraft:netherite_ingot 1"
            - "give %player% minecraft:enchanted_golden_apple 3"
            - "ps give 15 %player% 10"
        
        LEYENDA:
          titulo: "§c§l¡Leyenda Alcanzada!"
          descripcion: "§e%jugador% §7alcanzó Leyenda"
          xp: 2000
          comandos:
            - "give %player% minecraft:netherite_ingot 2"
            - "give %player% minecraft:nether_star 1"
            - "ps give 15 %player% 15"
        
        MAESTRO:
          titulo: "§5§l¡Maestro Alcanzado!"
          descripcion: "§e%jugador% §7alcanzó Maestro"
          xp: 3000
          comandos:
            - "give %player% minecraft:netherite_ingot 3"
            - "give %player% minecraft:nether_star 2"
            - "give %player% minecraft:elytra 1"
        
        TITAN:
          titulo: "§4§l¡Titán Alcanzado!"
          descripcion: "§e%jugador% §7alcanzó Titán"
          xp: 5000
          comandos:
            - "give %player% minecraft:netherite_ingot 5"
            - "give %player% minecraft:nether_star 3"
            - "give %player% minecraft:enchanted_golden_apple 5"
        
        ABSOLUTO:
          titulo: "§f§l¡ABSOLUTO ALCANZADO!"
          descripcion: "§e%jugador% §7alcanzó §f§lABSOLUTO"
          xp: 10000
          comandos:
            - "give %player% minecraft:netherite_block 1"
            - "give %player% minecraft:nether_star 5"
            - "give %player% minecraft:dragon_egg 1"
    
    # ═════════════════════════════════════════════════════════════
    # 🌍 RECOMPENSAS POR RÉCORDS DE POBLACIÓN
    # ═════════════════════════════════════════════════════════════
    records_poblacion:
      # Cuando se alcanza un nuevo récord histórico
      nuevo_record:
        titulo: "§6§l⭐ ¡NUEVO RÉCORD!"
        descripcion: "§7Récord histórico: §e%cantidad% §7jugadores online"
        xp_por_jugador: 100         # 100 XP por cada jugador
        comandos_base:
          - "give %player% minecraft:diamond 10"
          - "give %player% minecraft:nether_star 1"
        # Comandos adicionales según cantidad
        por_cantidad:
          10_jugadores:
            comandos:
              - "give %player% minecraft:netherite_ingot 1"
          15_jugadores:
            comandos:
              - "give %player% minecraft:netherite_ingot 2"
              - "give %player% minecraft:enchanted_golden_apple 3"
          20_jugadores:
            comandos:
              - "give %player% minecraft:netherite_block 1"
              - "give %player% minecraft:nether_star 2"
          25_jugadores:
            comandos:
              - "give %player% minecraft:netherite_block 2"
              - "give %player% minecraft:dragon_head 1"
        acumulable: true
      
      # Cuando mantienes X jugadores durante Y tiempo
      poblacion_sostenida:
        # 10+ jugadores durante 1 hora
        10_jugadores_1hora:
          titulo: "§a§l¡Población Sostenida!"
          descripcion: "§710+ jugadores §7durante §e1 hora"
          xp: 1000
          comandos:
            - "give %player% minecraft:diamond 15"
            - "give %player% minecraft:netherite_scrap 2"
          acumulable: true
        
        # 15+ jugadores durante 1 hora
        15_jugadores_1hora:
          titulo: "§6§l¡Gran Población Sostenida!"
          descripcion: "§715+ jugadores §7durante §e1 hora"
          xp: 2000
          comandos:
            - "give %player% minecraft:netherite_ingot 2"
            - "give %player% minecraft:nether_star 1"
          acumulable: true
        
        # 20+ jugadores durante 1 hora
        20_jugadores_1hora:
          titulo: "§c§l¡POBLACIÓN ÉPICA!"
          descripcion: "§720+ jugadores §7durante §e1 hora"
          xp: 5000
          comandos:
            - "give %player% minecraft:netherite_block 1"
            - "give %player% minecraft:nether_star 3"
            - "give %player% minecraft:enchanted_golden_apple 10"
          acumulable: true
    
    # ═════════════════════════════════════════════════════════════
    # 📊 HITOS ACUMULATIVOS
    # ═════════════════════════════════════════════════════════════
    hitos_acumulativos:
      # Total de jugadores nuevos que se unieron
      jugadores_nuevos_totales:
        5_jugadores:
          titulo: "§a§l¡5 Jugadores Nuevos!"
          descripcion: "§7Has atraído §e5 jugadores §7nuevos"
          xp: 1000
          comandos:
            - "give %player% minecraft:diamond 20"
            - "give %player% minecraft:netherite_scrap 3"
        
        10_jugadores:
          titulo: "§6§l¡10 Jugadores Nuevos!"
          descripcion: "§7Has atraído §e10 jugadores §7nuevos"
          xp: 2500
          comandos:
            - "give %player% minecraft:netherite_ingot 2"
            - "give %player% minecraft:nether_star 1"
        
        25_jugadores:
          titulo: "§c§l¡25 Jugadores Nuevos!"
          descripcion: "§7Has atraído §e25 jugadores §7nuevos"
          xp: 5000
          comandos:
            - "give %player% minecraft:netherite_ingot 5"
            - "give %player% minecraft:nether_star 3"
            - "give %player% minecraft:elytra 1"
        
        50_jugadores:
          titulo: "§5§l¡50 JUGADORES NUEVOS!"
          descripcion: "§7Has atraído §e50 jugadores §7nuevos"
          xp: 10000
          comandos:
            - "give %player% minecraft:netherite_block 2"
            - "give %player% minecraft:nether_star 5"
            - "give %player% minecraft:dragon_egg 1"
        
        100_jugadores:
          titulo: "§f§l¡100 JUGADORES NUEVOS!"
          descripcion: "§7Has atraído §e§l100 jugadores §7nuevos"
          xp: 25000
          comandos:
            - "give %player% minecraft:netherite_block 5"
            - "give %player% minecraft:nether_star 10"
            - "give %player% minecraft:beacon 1"
      
      # Total de jugadores que alcanzaron cada rango
      jugadores_por_rango:
        5_exploradores:
          titulo: "§b¡5 Exploradores!"
          xp: 800
          comandos:
            - "give %player% minecraft:diamond 10"
        
        10_sobrevivientes:
          titulo: "§e¡10 Sobrevivientes!"
          xp: 2000
          comandos:
            - "give %player% minecraft:netherite_ingot 2"
        
        5_veteranos:
          titulo: "§6¡5 Veteranos!"
          xp: 3000
          comandos:
            - "give %player% minecraft:netherite_ingot 3"
            - "give %player% minecraft:nether_star 1"
        
        5_leyendas:
          titulo: "§c¡5 Leyendas!"
          xp: 5000
          comandos:
            - "give %player% minecraft:netherite_block 1"
            - "give %player% minecraft:nether_star 2"
    
    # ═════════════════════════════════════════════════════════════
    # 🏆 LOGROS ESPECIALES
    # ═════════════════════════════════════════════════════════════
    logros_especiales:
      # Primera vez que alguien alcanza ABSOLUTO
      primer_absoluto:
        titulo: "§f§l⭐ PRIMER ABSOLUTO"
        descripcion: "§e%jugador% §7es el primer §f§lABSOLUTO"
        xp: 15000
        comandos:
          - "give %player% minecraft:netherite_block 3"
          - "give %player% minecraft:nether_star 10"
          - "give %player% minecraft:beacon 1"
        unico: true               # Solo se da una vez
      
      # Stream más largo (horas consecutivas)
      stream_maratoniano:
        6_horas:
          titulo: "§a§l¡Stream de 6 Horas!"
          xp: 2000
          comandos:
            - "give %player% minecraft:diamond 20"
        
        12_horas:
          titulo: "§6§l¡Stream de 12 Horas!"
          xp: 5000
          comandos:
            - "give %player% minecraft:netherite_ingot 3"
            - "give %player% minecraft:nether_star 2"
        
        24_horas:
          titulo: "§c§l¡STREAM DE 24 HORAS!"
          xp: 20000
          comandos:
            - "give %player% minecraft:netherite_block 2"
            - "give %player% minecraft:nether_star 5"
            - "give %player% minecraft:dragon_head 1"
      
      # Retención: X jugadores volvieron después de 7 días
      buena_retencion:
        5_jugadores_retenidos:
          titulo: "§a¡Buena Retención!"
          descripcion: "§75 jugadores §7volvieron después de §e7+ días"
          xp: 1500
          comandos:
            - "give %player% minecraft:diamond 15"
        
        10_jugadores_retenidos:
          titulo: "§6¡Excelente Retención!"
          descripcion: "§710 jugadores §7volvieron después de §e7+ días"
          xp: 3000
          comandos:
            - "give %player% minecraft:netherite_ingot 2"
            - "give %player% minecraft:nether_star 1"
    
    # ═════════════════════════════════════════════════════════════
    # ⚙️ CONFIGURACIÓN DEL SISTEMA
    # ═════════════════════════════════════════════════════════════
    configuracion:
      # Notificaciones
      notificar_recompensa_disponible: true
      mensaje_notificacion: "&6&l[RECOMPENSA] &e¡Tienes una nueva recompensa en /recompensas!"
      titulo_notificacion:
        enabled: true
        titulo: "&6&l⭐ NUEVA RECOMPENSA"
        subtitulo: "&eRevisa /recompensas"
      
      # Sonido al recibir recompensa
      sonido:
        enabled: true
        tipo: "ENTITY_PLAYER_LEVELUP"
        volumen: 1.0
        pitch: 1.2
      
      # Guardar en base de datos
      persistente: true
      
      # Expiración de recompensas (0 = nunca expiran)
      dias_expiracion: 0
      
      # Límite de recompensas acumuladas
      limite_recompensas: 100       # Máximo 100 recompensas pendientes
  
  # ═══════════════════════════════════════════════════════════════
  # 🌍 BONIFICACIÓN POR POBLACIÓN ALTA - Multiplicador para todos
  # ═══════════════════════════════════════════════════════════════
  bonificacion_poblacion:
    enabled: true
    
    # Población base (promedio normal del servidor)
    poblacion_base: 5                # Ajusta según tu promedio habitual
    
    # Multiplicadores dinámicos según población online (para TODOS los jugadores)
    niveles:
      # 6-8 jugadores: +10% XP
      moderado:
        jugadores_minimos: 6
        multiplicador: 1.10
        mensaje: "&a&l[POBLACIÓN] &e6+ jugadores online! &a+10% XP"
        actionbar: "&a⚡ Servidor Activo: +10% XP"
      
      # 9-12 jugadores: +20% XP
      alto:
        jugadores_minimos: 9
        multiplicador: 1.20
        mensaje: "&a&l[POBLACIÓN] &e9+ jugadores online! &a+20% XP"
        actionbar: "&a⚡ Servidor Muy Activo: +20% XP"
      
      # 13-16 jugadores: +30% XP
      muy_alto:
        jugadores_minimos: 13
        multiplicador: 1.30
        mensaje: "&6&l[POBLACIÓN] &e13+ jugadores online! &6+30% XP"
        actionbar: "&6⚡ ¡Servidor Épico!: +30% XP"
      
      # 17+ jugadores: +50% XP
      record:
        jugadores_minimos: 17
        multiplicador: 1.50
        mensaje: "&6&l[POBLACIÓN] &c17+ jugadores! &6&l+50% XP"
        actionbar: "&6&l⚡ ¡RÉCORD DEL SERVIDOR!: +50% XP"
    
    # Notificaciones de cambio de nivel
    notificar_cambios: true
    notificar_actionbar: true        # Mostrar bonus en ActionBar constantemente
    intervalo_notificacion_seg: 300  # Re-notificar cada 5 minutos
    
    # Efectos visuales cuando se alcanza récord
    efectos_record:
      fuegos_artificiales: true
      particulas: true
      sonido: true
  
  # Multiplicadores base (REDUCIDOS - ahora el foco es el streamer)
  multiplicadores:
    racha_por_dia: 0.05             # +5% por cada día de racha (antes 10%)
    max_dias_racha: 7               # Máximo 7 días = +35% (antes +70%)
  
  # ─────────────────────────────────────────────────────────────
  # COMBOS RÁPIDOS - Bonus por acciones consecutivas
  # ─────────────────────────────────────────────────────────────
  combos:
    multiplicador: 1.3          # Multiplicador base por combo
    ventana_ms: 5000            # Tiempo entre acciones para mantener combo (5 seg)
    acciones_minimas: 3         # Acciones mínimas para activar combo
    limite_maximo: 10           # Límite máximo de combo (evita farmeo infinito)
  
  # ─────────────────────────────────────────────────────────────
  # MULTIPLICADORES POR DIMENSIÓN
  # ─────────────────────────────────────────────────────────────
  dimensiones:
    overworld: 1.0              # Multiplicador en Overworld
    nether: 1.3                 # x1.3 en el Nether
    end: 1.5                    # x1.5 en el End
  
  # ─────────────────────────────────────────────────────────────
  # PROTECCIÓN ANTI-FARM
  # ─────────────────────────────────────────────────────────────
  anti_farm:
    enabled: true               # Activar detección anti-farm
    umbral_acciones: 50         # Acciones en la ventana para detectar farm
    ventana_segundos: 60        # Ventana de tiempo en segundos
    penalizacion: 0.1           # Reducción de XP (10% del normal)
  
  # ─────────────────────────────────────────────────────────────
  # SISTEMA DE MILESTONES - Bonus por hitos
  # ─────────────────────────────────────────────────────────────
  milestones:
    enabled: true               # Activar sistema de milestones
    # Los milestones se otorgan automáticamente al alcanzar:
    # 50, 100, 250, 500, 1000, 2500, 5000 acciones por categoría

# ═══════════════════════════════════════════════════════════════
# FUENTES DE EXPERIENCIA (XP por acción)
