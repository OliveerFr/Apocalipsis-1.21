# ════════════════════════════════════════════════════════════════════
# Apocalipsis — recompensas.yml
# Sistema de recompensas por subida de rango, configuración de XP
# y recompensas por completar misiones diarias
# ════════════════════════════════════════════════════════════════════

version: 1

# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR COMPLETAR MISIONES INDIVIDUALES
# ═══════════════════════════════════════════════════════════════

recompensas_por_mision:
  enabled: true
  
  # Recompensas según dificultad de la misión
  por_dificultad:
    FACIL:
      # Probabilidad de recompensa (0.0 - 1.0)
      probabilidad: 0.20          # 20% de chance (antes 30%)
      items:
        - "give %player% minecraft:bread 2"
        - "give %player% minecraft:cooked_beef 1"
      mensaje: "&a¡Bonus! &7+2 Pan"
      
    MEDIA:
      probabilidad: 0.30          # 30% de chance (antes 40%)
      items:
        - "give %player% minecraft:iron_ingot 2"
        - "give %player% minecraft:gold_ingot 1"
        - "give %player% minecraft:arrow 8"
      mensaje: "&a¡Bonus! &7+2 Hierro, +1 Oro, +8 Flechas"
      
    DIFICIL:
      probabilidad: 0.40          # 40% de chance (antes 50%)
      items:
        - "give %player% minecraft:diamond 1"
        - "give %player% minecraft:golden_apple 1"
        - "give %player% minecraft:experience_bottle 3"
      mensaje: "&a¡Bonus! &7+1 Diamante, +1 Manzana Dorada, +3 XP Bottles"

# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR COMPLETAR TODAS LAS MISIONES DEL DÍA
# ═══════════════════════════════════════════════════════════════

recompensas_diarias_completas:
  enabled: true
  
  # Recompensas base (siempre se dan)
  recompensas_base:
    comandos:
      - "give %player% minecraft:diamond 5"              # Antes 3
      - "give %player% minecraft:golden_apple 3"         # Antes 2
      - "give %player% minecraft:experience_bottle 8"    # Antes 5
    mensaje: "&6&l★ ¡MISIONES DIARIAS COMPLETADAS! &r&7Has recibido recompensas especiales"
    
  # Recompensas adicionales según el rango del jugador
  bonus_por_rango:
    NOVATO:
      comandos:
        - "give %player% minecraft:iron_ingot 5"
      mensaje: "&a[Bonus Novato] &7+5 Lingotes de Hierro"
      
    EXPLORADOR:
      comandos:
        - "give %player% minecraft:iron_ingot 8"
        - "give %player% minecraft:ender_pearl 2"
      mensaje: "&b[Bonus Explorador] &7+8 Hierro, +2 Perlas de Ender"
      
    SOBREVIVIENTE:
      comandos:
        - "give %player% minecraft:diamond 2"
        - "give %player% minecraft:ender_pearl 4"
      mensaje: "&e[Bonus Sobreviviente] &7+2 Diamantes, +4 Perlas de Ender"
      
    VETERANO:
      comandos:
        - "give %player% minecraft:diamond 3"
        - "give %player% minecraft:netherite_scrap 1"
        - "give %player% minecraft:ender_pearl 6"
      mensaje: "&6[Bonus Veterano] &7+3 Diamantes, +1 Netherite Scrap, +6 Perlas"
      
    LEYENDA:
      comandos:
        - "give %player% minecraft:diamond 5"
        - "give %player% minecraft:netherite_scrap 2"
        - "give %player% minecraft:enchanted_golden_apple 1"
      mensaje: "&c[Bonus Leyenda] &7+5 Diamantes, +2 Scrap, +1 Manzana Encantada"
      
    MAESTRO:
      comandos:
        - "give %player% minecraft:netherite_ingot 1"
        - "give %player% minecraft:enchanted_golden_apple 2"
        - "give %player% minecraft:totem_of_undying 1"
      mensaje: "&5[Bonus Maestro] &7+1 Netherite, +2 Manzanas Encantadas, +1 Tótem"
      
    TITAN:
      comandos:
        - "give %player% minecraft:netherite_ingot 2"
        - "give %player% minecraft:enchanted_golden_apple 3"
        - "give %player% minecraft:nether_star 1"
      mensaje: "&4[Bonus Titán] &7+2 Netherite, +3 Manzanas Encantadas, +1 Estrella"
      
    ABSOLUTO:
      comandos:
        - "give %player% minecraft:netherite_ingot 3"
        - "give %player% minecraft:enchanted_golden_apple 5"
        - "give %player% minecraft:nether_star 2"
        - "give %player% minecraft:elytra 1"
      mensaje: "&f&l[Bonus Absoluto] &7+3 Netherite, +5 Manzanas Enc., +2 Estrellas, +1 Élitro"
  
  # Mensaje de celebración
  titulo: "&6&l¡COMPLETADO!"
  subtitulo: "&eHas terminado todas las misiones del día"
  
  # Efectos especiales
  efectos:
    fuegos_artificiales: 5      # Cantidad de fuegos artificiales
    particulas: true             # Mostrar partículas épicas
    sonidos: true                # Reproducir sonidos de victoria

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE EXPERIENCIA (XP)
# ═══════════════════════════════════════════════════════════════

# Fórmula para XP necesario por nivel: base + (nivel * multiplicador)
# ⚠️ AJUSTADO PARA SERIE DE 75 DÍAS (jugadores muy activos alcanzan ABSOLUTO en ~75 días)
experiencia:
  nivel_inicial: 200           # XP necesario para nivel 2 (antes 140)
  multiplicador: 150            # XP adicional por cada nivel (antes 70)
  # Ejemplo: Nivel 2 = 200, Nivel 3 = 350, Nivel 4 = 500, etc.
  # Total para nivel 50 (ABSOLUTO): ~110,075 XP

# Fuentes de experiencia
fuentes_xp:
  # Misiones diarias - PRINCIPAL fuente de XP
  misiones:
    enabled: true
    por_dificultad:
      FACIL: 80                # ~12 misiones/día para novatos (antes 100)
      MEDIA: 150               # ~8-10 misiones/día (antes 200)
      DIFICIL: 300             # ~4-6 misiones/día (antes 400)
    multiplicador_por_rango:   # Bonus XP por rango alto (reducido para evitar snowball)
      NOVATO: 1.0
      EXPLORADOR: 1.0
      SOBREVIVIENTE: 1.02      # Antes 1.05
      VETERANO: 1.05           # Antes 1.10
      LEYENDA: 1.08            # Antes 1.15
      MAESTRO: 1.10            # Antes 1.20
      TITAN: 1.12              # Antes 1.25
      ABSOLUTO: 1.15           # Antes 1.30

  # Matar mobs - SECUNDARIO (para jugadores 24/7)
  matar_mobs:
    enabled: true
    hostiles:                  # Mobs hostiles (zombies, skeletons, etc.)
      xp: 1                    # Antes 2
      cooldown: 0              # Sin cooldown
    pasivos:                   # Animales (vacas, cerdos, etc.)
      xp: 0                    # Antes 1 (eliminado para evitar farming)
      cooldown: 0
    jefes:                     # Wither, Dragon, etc.
      xp: 75                   # Antes 100
      cooldown: 0
    
  # Minar bloques - Todos los minerales configurados (SIN PIEDRA)
  minar_bloques:
    enabled: true
    bloques:
      # Minerales vanilla (STONE eliminado - solo ores)
      COAL_ORE: 0.5            # Antes 1
      DEEPSLATE_COAL_ORE: 0.5
      IRON_ORE: 1              # Antes 2
      DEEPSLATE_IRON_ORE: 1
      COPPER_ORE: 0.5          # Antes 1
      DEEPSLATE_COPPER_ORE: 0.5
      GOLD_ORE: 2              # Antes 3
      DEEPSLATE_GOLD_ORE: 2
      REDSTONE_ORE: 1          # Antes 2
      DEEPSLATE_REDSTONE_ORE: 1
      EMERALD_ORE: 4           # Antes 5
      DEEPSLATE_EMERALD_ORE: 4
      LAPIS_ORE: 1             # Antes 2
      DEEPSLATE_LAPIS_ORE: 1
      DIAMOND_ORE: 4           # Antes 5
      DEEPSLATE_DIAMOND_ORE: 4
      # Minerales del Nether
      NETHER_GOLD_ORE: 2       # Antes 3
      NETHER_QUARTZ_ORE: 1     # Antes 2
      ANCIENT_DEBRIS: 8        # Antes 10
    cooldown_segundos: 3       # Antes 0 (añadido para evitar spam)

  # Farming/Cosecha - MUY BAJO
  cosechar:
    enabled: true
    xp: 0.3                    # 3 crops = 1 XP (antes 0.5)
    cooldown_segundos: 10      # Antes 5

  # Craftear items - MUY BAJO
  craftear:
    enabled: true
    items:
      STONE_PICKAXE: 0.5       # Antes 1
      IRON_PICKAXE: 1          # Antes 2
      DIAMOND_PICKAXE: 4       # Antes 5
      NETHERITE_PICKAXE: 8     # Antes 10
    cooldown_segundos: 15      # Antes 10

  # Pescar - MUY BAJO
  pescar:
    enabled: true
    xp: 1.5                    # Antes 2
    cooldown_segundos: 20      # Antes 15

# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR SUBIDA DE RANGO (ÉPICAS - EVENTOS MEMORABLES)
# ═══════════════════════════════════════════════════════════════

recompensas_por_rango:
  # Al alcanzar EXPLORADOR (~Día 3-5)
  EXPLORADOR:
    comandos:
      - "ps give %player% 15"                                # 1 bloque de protección
      - "give %player% minecraft:diamond 8"                    # 8 diamantes (antes 5)
      - "give %player% minecraft:golden_apple 5"               # 5 manzanas doradas (antes 3)
      - "give %player% minecraft:iron_block 16"                # 16 bloques de hierro (nuevo)
    mensaje: "&b¡Has alcanzado el rango EXPLORADOR! &7Recompensas entregadas"
    
  # Al alcanzar SOBREVIVIENTE (~Día 10-12)
  SOBREVIVIENTE:
    comandos:
      - "ps give %player% 15"                                # 1 bloque de protección
      - "give %player% minecraft:diamond 15"                   # 15 diamantes (antes 10)
      - "give %player% minecraft:golden_apple 8"               # 8 manzanas doradas (antes 5)
      - "give %player% minecraft:ender_pearl 32"               # 32 perlas de ender (antes 16)
      - "give %player% minecraft:enchanted_book 1"             # Libro encantado (nuevo)
