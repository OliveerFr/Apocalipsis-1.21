# ═══════════════════════════════════════════════════════════════
# RECOMPENSAS POR SUBIDA DE RANGO (ÉPICAS - EVENTOS MEMORABLES)
# ═══════════════════════════════════════════════════════════════

recompensas_por_rango:
  # Al alcanzar EXPLORADOR (~Día 3-5)
  EXPLORADOR:
    comandos:
      - "ps give %player% 15"                                # 1 bloque de protección
      - "give %player% minecraft:diamond 8"                    # 8 diamantes (antes 5)
      - "give %player% minecraft:golden_apple 5"               # 5 manzanas doradas (antes 3)
      - "give %player% minecraft:iron_block 16"                # 16 bloques de hierro (nuevo)
    mensaje: "&b¡Has alcanzado el rango EXPLORADOR! &7Recompensas entregadas"
    
  # Al alcanzar SOBREVIVIENTE (~Día 10-12)
  SOBREVIVIENTE:
    comandos:
      - "ps give %player% 15"                                # 1 bloque de protección
      - "give %player% minecraft:diamond 15"                   # 15 diamantes (antes 10)
      - "give %player% minecraft:golden_apple 8"               # 8 manzanas doradas (antes 5)
      - "give %player% minecraft:ender_pearl 32"               # 32 perlas de ender (antes 16)
      - "give %player% minecraft:enchanted_book 1"             # Libro encantado (nuevo)
    mensaje: "&e¡Has alcanzado el rango SOBREVIVIENTE! &7Recompensas entregadas"
    
  # Al alcanzar VETERANO (~Día 20-25)
  VETERANO:
    comandos:
      - "ps give %player% 15 2"                              # 2 bloques de protección
      - "give %player% minecraft:diamond 25"                   # 25 diamantes (antes 20)
      - "give %player% minecraft:enchanted_golden_apple 3"     # 3 manzanas encantadas (antes 2)
      - "give %player% minecraft:ender_pearl 64"               # 64 perlas de ender (antes 32)
      - "give %player% minecraft:totem_of_undying 2"           # 2 tótems (antes 1)
      - "give %player% minecraft:diamond_block 8"              # 8 bloques de diamante (nuevo)
    mensaje: "&6¡Has alcanzado el rango VETERANO! &7Recompensas entregadas"
    
  # Al alcanzar LEYENDA (~Día 35-40)
  LEYENDA:
    comandos:
      - "ps give %player% 15 2"                              # 2 bloques de protección
      - "give %player% minecraft:netherite_ingot 8"            # 8 lingotes (antes 5)
      - "give %player% minecraft:enchanted_golden_apple 5"     # 5 manzanas encantadas (antes 3)
      - "give %player% minecraft:totem_of_undying 3"           # 3 tótems (antes 2)
      - "give %player% minecraft:elytra 1"                     # 1 élitro
      - "give %player% minecraft:dragon_head 1"                # Cabeza de dragón (nuevo)
    mensaje: "&c¡Has alcanzado el rango LEYENDA! &7Recompensas entregadas"
    
  # Al alcanzar MAESTRO (~Día 50-55)
  MAESTRO:
    comandos:
      - "ps give %player% 15 3"                              # 3 bloques de protección
      - "give %player% minecraft:netherite_ingot 15"           # 15 lingotes (antes 10)
      - "give %player% minecraft:enchanted_golden_apple 8"     # 8 manzanas encantadas (antes 5)
      - "give %player% minecraft:totem_of_undying 5"           # 5 tótems (antes 3)
      - "give %player% minecraft:nether_star 3"                # 3 estrellas (antes 2)
      - "give %player% minecraft:netherite_block 4"            # 4 bloques netherite (nuevo)
    mensaje: "&5¡Has alcanzado el rango MAESTRO! &7Recompensas entregadas"
    
  # Al alcanzar TITAN (~Día 65-70)
  TITAN:
    comandos:
      - "ps give %player% 15 3"                              # 3 bloques de protección
      - "give %player% minecraft:netherite_ingot 25"           # 25 lingotes (antes 20)
      - "give %player% minecraft:enchanted_golden_apple 12"    # 12 manzanas encantadas (antes 8)
      - "give %player% minecraft:totem_of_undying 8"           # 8 tótems (antes 5)
      - "give %player% minecraft:nether_star 5"                # 5 estrellas (antes 3)
      - "give %player% minecraft:beacon 1"                     # 1 faro (nuevo)
    mensaje: "&4¡Has alcanzado el rango TITAN! &7Recompensas entregadas"
    
  # Al alcanzar ABSOLUTO (~Día 75) - ¡ÉPICO!
  ABSOLUTO:
    comandos:
      - "ps give %player% 15 5"                              # 5 bloques de protección
      - "give %player% minecraft:netherite_ingot 48"           # 48 lingotes (antes 32)
      - "give %player% minecraft:enchanted_golden_apple 32"    # 32 manzanas encantadas (antes 16)
      - "give %player% minecraft:totem_of_undying 15"          # 15 tótems (antes 10)
      - "give %player% minecraft:nether_star 10"               # 10 estrellas (antes 5)
      - "give %player% minecraft:beacon 2"                     # 2 faros (antes 1)
      - "give %player% minecraft:dragon_egg 1"                 # HUEVO DE DRAGÓN (nuevo)
      - "give %player% minecraft:netherite_block 16"           # 16 bloques netherite (nuevo)
    mensaje: "&f&l¡Has alcanzado el rango ABSOLUTO! &7¡Eres una leyenda viviente!"

# ═══════════════════════════════════════════════════════════════
# HABILIDADES PASIVAS POR RANGO (BALANCEADAS)
# Las habilidades se activan automáticamente al tener el rango
# ═══════════════════════════════════════════════════════════════

habilidades_por_rango:
  # Novato - Sin habilidades especiales
  NOVATO:
    habilidades: []
    
  # Explorador - Bonus leve de velocidad
  EXPLORADOR:
    habilidades:
      - type: "SPEED"
        level: 1                 # Speed I permanente
        descripcion: "&bVelocidad I &7permanente"
    
  # Sobreviviente - Regeneración leve + mantiene speed
  SOBREVIVIENTE:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 1                 # Regeneration I permanente
        descripcion: "&eRegeneración I &7permanente"
    
  # Veterano - Resistencia añadida
  VETERANO:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 1
        descripcion: "&eRegeneración I &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1                 # Resistance I permanente
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"       # No pierde hambre tan rápido
        level: 1
        descripcion: "&aSaciedad mejorada"
    
  # Leyenda - Fuerza añadida, Regen II
  LEYENDA:
    habilidades:
      - type: "SPEED"
        level: 1
        descripcion: "&bVelocidad I &7permanente"
      - type: "REGENERATION"
        level: 2                 # Regeneration II (antes en Maestro)
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1                 # Strength I permanente
        descripcion: "&cFuerza I &7permanente"
    
  # Maestro - Speed II, Haste I
  MAESTRO:
    habilidades:
      - type: "SPEED"
        level: 2                 # Speed II (upgrade)
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 2
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 1                 # Resistance I (antes II)
        descripcion: "&6Resistencia I &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1
        descripcion: "&cFuerza I &7permanente"
      - type: "FAST_DIGGING"     # Haste I permanente
        level: 1
        descripcion: "&7Prisa I &7permanente"
    
  # Titan - Resistance II, Haste II, Health Boost V
  TITAN:
    habilidades:
      - type: "SPEED"
        level: 2
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 2                 # Regen II (antes III, más balanceado)
        descripcion: "&eRegeneración II &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 2                 # Resistance II (upgrade)
        descripcion: "&6Resistencia II &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 1                 # Strength I (antes II, más balanceado)
        descripcion: "&cFuerza I &7permanente"
      - type: "FAST_DIGGING"
        level: 2                 # Haste II (upgrade)
        descripcion: "&7Prisa II &7permanente"
      - type: "HEALTH_BOOST"     # +10 corazones permanentes
        level: 5
        descripcion: "&4Vida extra (+10 ❤)"
    
  # Absoluto - El máximo poder (pero balanceado)
  ABSOLUTO:
    habilidades:
      - type: "SPEED"
        level: 2
        descripcion: "&bVelocidad II &7permanente"
      - type: "REGENERATION"
        level: 3                 # Regen III (antes IV, más balanceado)
        descripcion: "&eRegeneración III &7permanente"
      - type: "DAMAGE_RESISTANCE"
        level: 2                 # Resistance II (antes III, más balanceado)
        descripcion: "&6Resistencia II &7permanente"
      - type: "SATURATION"
        level: 1
        descripcion: "&aSaciedad mejorada"
      - type: "INCREASE_DAMAGE"
        level: 2                 # Strength II
        descripcion: "&cFuerza II &7permanente"
      - type: "FAST_DIGGING"
        level: 2
        descripcion: "&7Prisa II &7permanente"
      - type: "HEALTH_BOOST"
