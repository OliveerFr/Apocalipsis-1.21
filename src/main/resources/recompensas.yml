  # Al alcanzar TRASCENDENTE (Titan) (~Día 65-70) - Más allá
  TITAN:
    comandos:
      - "ps give 15 %player% 3"                              # 3 bloques protección
      - "give %player% minecraft:netherite_ingot 20"
      - "give %player% minecraft:enchanted_golden_apple 10"
      - "give %player% minecraft:totem_of_undying 6"
      - "give %player% minecraft:nether_star 4"
      - "give %player% minecraft:netherite_block 5"
