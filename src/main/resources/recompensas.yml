      - "give %player% minecraft:totem_of_undying 1"
      - "give %player% minecraft:diamond_block 6"
      - "give %player% minecraft:netherite_scrap 2"
    mensaje: "&e¡Tu PERSEVERANCIA es inquebrantable! &7El poder fluye en ti..."
    
  # Al alcanzar ASCENDIDO (Leyenda) (~Día 35-40) - La elevación
  LEYENDA:
    comandos:
      - "ps give 15 %player% 2"                              # 2 bloques protección
      - "give %player% minecraft:netherite_ingot 6"
      - "give %player% minecraft:enchanted_golden_apple 4"
      - "give %player% minecraft:totem_of_undying 2"
      - "give %player% minecraft:elytra 1"
      - "give %player% minecraft:dragon_head 1"
      - "give %player% minecraft:experience_bottle 32"
    mensaje: "&6¡Has ASCENDIDO más allá de los mortales! &7La leyenda crece..."
    
  # Al alcanzar ILUMINADO (Maestro) (~Día 50-55) - La sabiduría
  MAESTRO:
    comandos:
      - "ps give 15 %player% 3"                              # 3 bloques protección
      - "give %player% minecraft:netherite_ingot 12"
      - "give %player% minecraft:enchanted_golden_apple 6"
      - "give %player% minecraft:totem_of_undying 4"
