name: Apocalipsis
version: '${project.version}'
main: me.apocalipsis.Apocalipsis
api-version: 1.21
author: OliveerF
description: Plugin completo con estados globales, desastres y misiones
softdepend:
  - WorldGuard
  - ProtectionStones
  - ModelEngine
  - MythicMobs
  - Multiverse-Core

commands:
  avo:
    description: Comando principal de Apocalipsis
    usage: /avo <subcommand>
    aliases: [avoc, apoc, apocalipsis]
  apocalipsis:
    description: Alias principal de Apocalipsis
    usage: /apocalipsis <subcommand>
  misionestuto:
    description: Ver tus hitos de tutorial y progreso
    usage: /misionestuto
    aliases: [tuto, hitostuto]
  ciclo:
    description: Atajo para gestión de ciclos multi-mundo
    usage: /ciclo [nuevo|crear|listar|info|menu]
    aliases: [cycles, mundos]
  recompensa:
    description: Abre el menú de recompensas pendientes
    usage: /recompensa
    aliases: [rewards, reward, recompensas]
  habilidades:
    description: Abre el menú de habilidades
    usage: /habilidades
    aliases: [habilidad, skills, skill]
  mochila:
    description: Abre tu mochila virtual
    usage: /mochila
    aliases: [backpack, bag, bp]
  echest:
    description: Abre tu ender chest portátil
    usage: /echest
    aliases: [enderchest, ec]
  waypoint:
    description: Gestiona tus waypoints y teleport a cama
    usage: /wp [nombre|set|bed|delete|list]
    aliases: [wp]
  coords:
    description: Muestra tus coordenadas actuales
    usage: /coords
    aliases: [coordenadas, ubicacion, pos]
  toggle:
    description: Activa o desactiva una habilidad
    usage: /toggle <habilidad>
    aliases: [skill, hab]
  invocar:
    description: Invoca una entidad aliada
    usage: /invocar <entidad>
    aliases: [invoke, invocacion]
  carta:
    description: Envía una carta escrita a Santa Claus
    usage: /carta
    aliases: [letter]
  cartas:
    description: Ver todas las cartas enviadas (solo admins)
    usage: /cartas
    aliases: [letters]
  menu:
    description: Abre el menú principal de Apocalipsis
    usage: /menu
    aliases: [gui, m]
  tutorial:
    description: Sistema de tutorial para nuevos jugadores
    usage: /tutorial [progreso|reset|fase|stats]
    aliases: [tut, guia]
  rtp:
    description: Teletransporte aleatorio a ubicación segura
    usage: /rtp
    aliases: [randomtp, wild, randomteleport]
  canjear:
    description: Ver y canjear tokens por recompensas
    usage: /canjear [item]
  volver:
    description: Escapar del End y volver al Overworld
    usage: /volver
    aliases: [overworld, salir, escape]

permissions:
  avo.admin:
    description: Acceso total al plugin
    default: op
  avo.user:
    description: Acceso a comandos básicos
    default: true
  apocalipsis.rtp:
    description: Permite usar el comando /rtp para teletransporte aleatorio
    default: true
  apocalipsis.tutorial.admin:
    description: Permite administrar el sistema de tutorial
    default: op
  apocalipsis.tutorial.user:
    description: Permite usar comandos básicos del tutorial
    default: true
  apocalipsis.ciclo.admin:
    description: Control total sobre el sistema de ciclos (crear, desactivar, teleportarse entre mundos)
    default: op
    children:
      apocalipsis.admin: true
  apocalipsis.ciclo.bypass:
    description: Bypass de todas las protecciones del sistema de ciclos (PELIGROSO - permite transferir items)
    default: false
  apocalipsis.evento6.admin:
    description: Permite iniciar y gestionar el Evento 6 - Cuando el Mundo Decide Olvidar
    default: op
    children:
      apocalipsis.admin: true
  apocalipsis.admin:
    description: Permisos de administrador general
    default: op
    children:
      avo.admin: true
