# CONFIGURACIÓN TÉCNICA
# ═══════════════════════════════════════════════════════════════════

tecnica:
  # Guardar progreso del evento
  guardar_progreso: true
  archivo_progreso: "evento6_progreso.yml"
  
  # Backup automático antes del reinicio
  backup_antes_reinicio: true
  
  # Permitir cancelación del evento (solo admin)
  permitir_cancelacion: true
  
  # ¿Permitir que jugadores entren durante el evento?
  permitir_entrada_tardía: true
  
  # ¿Dar items iniciales a jugadores que entran tarde?
  dar_items_entrada_tardia: false
  
  # Debug mode
  debug: false
  
  # Logging detallado
  log_detallado: true
  log_archivo: "evento6.log"
