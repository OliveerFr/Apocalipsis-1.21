# ═══════════════════════════════════════════════════════════════════
# EVENTO 5: LA APERTURA DEL END
# ═══════════════════════════════════════════════════════════════════
# El portal fragmentado despierta.
# Algo observa desde un lugar que no debería existir.
# Inicio: /avo evento5 start
# ═══════════════════════════════════════════════════════════════════

metadata:
  event_id: "apertura_end"
  event_number: 5
  nombre_display: "§8La Apertura del End"
  version: "2.0.0"
  enabled: true
  
  # Plugins opcionales (auto-detecta)
  mythicmobs: true
  modelengine: true
  
  # Comandos
  comandos:
    - "evento5"
    - "aperturaend"

# ═══════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DE MODEL ENGINE (Modo Épico)
# ═══════════════════════════════════════════════════════════════════

modelo:
  # ID del modelo en Model Engine
  # Este debe coincidir con el nombre del archivo .bbmodel en:
  # plugins/ModelEngine/models/
  model_engine_id: "toro_ender_dragon"
  
  # Configuración visual del modelo
  escala: 1.5  # Tamaño del modelo (1.0 = normal)
  
  # Efectos de partículas personalizados
  particulas_spawn:
    - type: "PORTAL"
      cantidad: 200
      radio: 2.0
    - type: "DRAGON_BREATH"
      cantidad: 100
      radio: 3.0
    - type: "END_ROD"
      cantidad: 50
      radio: 1.0

# ═══════════════════════════════════════════════════════════════════
# CONFIGURACIÓN DEL EVENTO
# ═══════════════════════════════════════════════════════════════════

evento:
  # Duración de la Fase 1 (viaje al portal desde el Overworld)
  duracion_fase_descubrimiento_segundos: 2700  # 45 minutos
  
  jugadores_minimos: 1
  jugadores_maximos: 20
  mundo_overworld: "world"
  mundo_end: "world_the_end"
  
  # Portal en el Overworld (coordenadas se generan automáticamente al iniciar)
  portal:
    distancia_minima_spawn: 2000  # Mínimo 2000 bloques desde quien inicia el evento
    distancia_maxima_spawn: 5000  # Máximo 5000 bloques desde quien inicia el evento
    radio_deteccion_llegada: 50   # Radio para detectar cuando jugadores llegan
    
    # Mecánica de agrupación para revelar dirección
    agrupacion_requerida:
      enabled: true
      radio_maximo: 50  # Los jugadores deben estar a menos de 50 bloques entre sí
      jugadores_minimos: 2  # Mínimo de jugadores que deben estar cerca
      mensaje_agrupacion: "§8[§7...§8] §7Tienen que estar juntos para descubrir el camino."
      mensaje_dispersos: "§c⚠ Los jugadores están muy dispersos. Necesitan agruparse para descubrir el camino al portal."
  
  # Spawns dramáticos durante el viaje (Fase 1: DESCUBRIMIENTO)
  spawns_dramaticos:
    enabled: true
    intervalo_minimo: 120  # Mínimo 2 minutos entre spawns
    intervalo_maximo: 300  # Máximo 5 minutos entre spawns
    radio_spawn: 30  # Spawns aparecen entre 15-30 bloques de jugadores
    
    # Entidades que pueden aparecer (formato: clave nombrada)
    entidades:
      enderman_spawn:
        tipo: "ENDERMAN"
        probabilidad: 100
        cantidad_min: 2
        cantidad_max: 5
        mensaje: "§8[§7...§8] §7Están observando."
        sonido: "ENTITY_ENDERMAN_SCREAM"
        
      endermite_spawn:
        tipo: "ENDERMITE"
        probabilidad: 75
        cantidad_min: 3
        cantidad_max: 8
        mensaje: "§8[§7...§8] §7Algo se arrastra desde el vacío."
        sonido: "ENTITY_SILVERFISH_AMBIENT"
        
      shulker_spawn:
        tipo: "SHULKER"
        probabilidad: 40
        cantidad_min: 1
        cantidad_max: 3
        mensaje: "§8[§7...§8] §7No deberían estar aquí."
        sonido: "ENTITY_SHULKER_AMBIENT"
        
      phantom_spawn:
        tipo: "PHANTOM"
        probabilidad: 55
        cantidad_min: 2
        cantidad_max: 4
        mensaje: "§8[§7...§8] §7El cielo también está corrupto."
        sonido: "ENTITY_PHANTOM_AMBIENT"
  
  # Escalado dinámico según jugadores - HP MASIVAMENTE AUMENTADO PARA BATALLA ÉPICA
  escalado:
    hp_base: 6000  # ÉPICO: Batalla larga y memorable (antes 4500)
    hp_por_jugador: 0.25  # +25% HP por jugador adicional (antes 0.20)
    daño_base: 25  # Golpes más devastadores (antes 20)
    daño_por_jugador: 0.18  # +18% daño por jugador (antes 0.15)

# ═══════════════════════════════════════════════════════════════════
# FASES DEL EVENTO
# ═══════════════════════════════════════════════════════════════════
# El evento tiene 5 fases narrativas:
# 1. DESCUBRIMIENTO (Overworld) - Viaje al portal
# 2. LLEGADA (Portal) - Activación y decisión de entrar
# 3. COMBATE (End) - Batalla contra el dragón (4 subfases)
# 4. VICTORIA (End) - Silencio tras la muerte del dragón
# 5. CLIFFHANGER (End) - Mensaje final misterioso

fases_evento:
  # ═══ FASE 1: DESCUBRIMIENTO (Overworld) ═══
  fase_1_descubrimiento:
    nombre: "§8Descubrimiento"
    duracion_segundos: 2700  # 45 minutos
    
    mensajes_observador:
      # Inicio del evento (0:00)
      inicio:
        - delay: 0
          texto: "§8[§7...§8] §7No debería existir tan pronto."
          tipo: "chat"  # Solo chat, misterio inicial
      
      # 40 minutos restantes (5:00 transcurridos)
      40_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7Huele a… antes."
          tipo: "chat"
        - delay: 60
          texto: "§8[§7...§8] §7Cenizas. Vacío. Vestigios."
          tipo: "chat"
      
      # 35 minutos restantes (10:00 transcurridos)
      35_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7Este umbral… lo recuerdo sellado."
          tipo: "titulo"  # Título para nostalgia
          titulo: "§8§o..."
          subtitulo: "§7§oEste umbral… lo recuerdo sellado."
      
      # 30 minutos restantes (15:00 transcurridos)
      30_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7Antes, esto tomaba más tiempo."
          tipo: "chat"
        - delay: 80
          texto: "§8[§7...§8] §7Siglos. No minutos."
          tipo: "chat"
      
      # 25 minutos restantes (20:00 transcurridos)
      25_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7Cuántas veces he visto este momento."
          tipo: "titulo"
          titulo: "§8§o..."
          subtitulo: "§7§oCuántas veces he visto este momento."
        - delay: 100
          texto: "§8[§7...§8] §7Y cuántas más faltan."
          tipo: "chat"
      
      # 20 minutos restantes (25:00 transcurridos)
      20_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7El mundo está… apurado."
          tipo: "chat"
        - delay: 60
          texto: "§8[§7...§8] §7Como si algo lo persiguiera."
          tipo: "titulo"
          titulo: "§8§o..."
          subtitulo: "§7§oComo si algo lo persiguiera."
      
      # 15 minutos restantes (30:00 transcurridos)
      15_min_restantes:
        - delay: 0
          texto: "§8⚡§8⚡§8⚡"
          tipo: "titulo"
          titulo: "§8§l15 minutos"
          subtitulo: "§7El portal se acerca"
        - delay: 40
          texto: "§8[§7...§8] §7No fueron suficientes la última vez."
          tipo: "chat"
        - delay: 100
          texto: "§8[§7...§8] §7Ni la anterior."
          tipo: "chat"
      
      # 10 minutos restantes (35:00 transcurridos)
      10_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7Puedo sentir el vacío desde aquí."
          tipo: "titulo"
          titulo: "§8§o..."
          subtitulo: "§7§oPuedo sentir el vacío desde aquí."
        - delay: 80
          texto: "§8[§7...§8] §7Frío. Silencioso. Esperando."
          tipo: "chat"
      
      # 5 minutos restantes (40:00 transcurridos)
      5_min_restantes:
        - delay: 0
          texto: "§c⚡§8⚡§c⚡"
          tipo: "titulo"
          titulo: "§c§l5 MINUTOS"
          subtitulo: "§7§oYa casi están ahí"
        - delay: 40
          texto: "§8[§7...§8] §7Si cruzan ese umbral, no hay marcha atrás."
          tipo: "chat"
        - delay: 80
          texto: "§8[§7...§8] §7Nunca la hay."
          tipo: "titulo"
          titulo: "§8§o..."
          subtitulo: "§7§oNunca la hay."
      
      # 3 minutos restantes (42:00 transcurridos)
      3_min_restantes:
        - delay: 0
          texto: "§8[§7...§8] §7El End no olvida."
          tipo: "chat"
        - delay: 60
          texto: "§8[§7...§8] §7Ni perdona."
          tipo: "titulo"
          titulo: "§8§l..."
          subtitulo: "§7§oNi perdona."
      
      # 1 minuto restante (44:00 transcurridos)
      1_min_restante:
        - delay: 0
          texto: "§c§l⚡§8§l⚡§c§l⚡"
          tipo: "titulo_grande"
          titulo: "§c§l1 MINUTO"
          subtitulo: "§8§oEl portal despierta"
        - delay: 40
          texto: "§8[§7...§8] §7Deberían haber traído más que armadura."
          tipo: "chat"
        - delay: 80
          texto: "§8[§7...§8] §7Deberían haber traído esperanza."
          tipo: "titulo"
          titulo: "§8§o..."
          subtitulo: "§7§oDeberían haber traído esperanza."
  
  # ═══ FASE 2: LLEGADA AL PORTAL ═══
  fase_2_llegada:
    nombre: "§8Llegada"
    
    mensajes_observador:
      al_detectar_jugadores:
        - "§8[§7...§8] §7Aquí fue donde todo terminó… más de una vez."
        - "§8[§7...§8] §7Y aun así, siguen entrando."
    
    portal_activacion:
      delay_segundos: 10  # El portal se activa lentamente, 10 segundos
      
      # Efectos visuales durante la activación
      efectos:
        particulas:
          - tipo: "END_ROD"
            cantidad: 200
            radio: 5
          - tipo: "REVERSE_PORTAL"
            cantidad: 500
            radio: 10
        sonidos:
          - "AMBIENT_CAVE:2.0:0.5"
          - "BLOCK_END_PORTAL_SPAWN:3.0:1.0"
      
      # Mensajes cuando el portal está completamente activado
      portal_abierto:
        titulo: "§5§lEL PORTAL SE ABRE"
        subtitulo: "§7No hay vuelta atrás..."
        mensaje: "§5§l⚡ EL OBSERVADOR: §7§o\"No hay vuelta atrás...\""
      
      mensaje_final: "§8El portal espera."
  
  # ═══ FASE 3: COMBATE (End) ═══
  fase_3_combate:
    nombre: "§8Combate"
    
    entrada_end:
      mensajes_observador:
        - delay: 0
          texto: "§8[§7...§8] §7No es el mismo lugar."
        - delay: 40
          texto: "§8[§7...§8] §7Nunca lo es."
    
    pre_dragon_spawn:
      delay_segundos: 20  # 20 segundos de tensión antes de que aparezca
      efectos:
        - "sonidos_ambiente"
        - "particulas_oscuras"
        - "cielo_oscurecido"
    
    # 4 SUBFASES DEL COMBATE ÉPICAS - BASADAS EN HP DEL DRAGÓN
    # Sub-fases progresivamente más intensas con mecánicas especiales
    subfases_dragon:
      subfase_1:
        nombre: "§8§l━━━ §5I §8§l━━━"
        hp_min: 75
        hp_max: 100
        descripcion: "§5El Despertar - §7El dragón emerge con fuerza renovada"
        
        # Múltiples diálogos que se van mostrando según el % de HP
        dialogos_observador:
          100: "§8[§7...§8] §7Ha comenzado otra vez."
          98: "§8[§7...§8] §5El ciclo eterno continúa…"
          95: "§8[§7...§8] §7Antes… esto era un final."
          93: "§8[§7...§8] §7El fin de todos los fines."
          92: "§8[§7...§8] §dLas personas celebraban."
          90: "§8[§7...§8] §7Ahora… es solo otro paso en algo más grande."
          88: "§8[§7...§8] §8Algo que nadie comprende aún."
          87: "§8[§7...§8] §8El dragón siempre cae. No importa cuántas veces renazca."
          85: "§8[§7...§8] §7¿Recuerda este lugar?"
          83: "§8[§7...§8] §5¿Recuerda las cenizas de sus encarnaciones pasadas?"
          82: "§8[§7...§8] §7¿Recuerda las veces que ha muerto aquí?"
          80: "§8[§7...§8] §8Yo sí. Todas y cada una."
          78: "§8[§7...§8] §7Mil dragones. Mil muertes."
          77: "§8[§7...§8] §7Sus alas conocen estos pilares…"
          76: "§8[§7...§8] §7Su aliento conoce estas piedras…"
      
      subfase_2:
        nombre: "§8§l━━━ §5II §8§l━━━"
        hp_min: 50
        hp_max: 75
        descripcion: "§5La Furia - §7El dragón se vuelve más agresivo y veloz"
        
        dialogos_observador:
          74: "§8[§7...§8] §5Algo cambia en sus ojos."
          73: "§8[§7...§8] §7Una furia ancestral despierta."
          72: "§8[§7...§8] §7La bestia siente el daño."
          71: "§8[§7...§8] §cY responde con violencia primitiva."
          70: "§8[§7...§8] §7Siempre lo matan."
          69: "§8[§7...§8] §8Generación tras generación."
          68: "§8[§7...§8] §dY él siempre vuelve."
          66: "§8[§7...§8] §5Más fuerte. Más rabioso."
          65: "§8[§7...§8] §7¿Cuántos ciclos lleva?"
          64: "§8[§7...§8] §8¿Mil? ¿Diez mil?"
          63: "§8[§7...§8] §8He perdido la cuenta."
          61: "§8[§7...§8] §7Los números dejan de importar."
          60: "§8[§7...§8] §7La rabia del dragón no es suya…"
          59: "§8[§7...§8] §5Es la suma de todas sus muertes."
          58: "§8[§7...§8] §7Es el eco de mil batallas pasadas."
          56: "§8[§7...§8] §4Mil derrotas grabadas en su esencia."
          55: "§8[§7...§8] §5Mil derrotas."
          54: "§8[§7...§8] §7Mil gritos silenciados."
          53: "§8[§7...§8] §8Mil renacimientos."
          52: "§8[§7...§8] §7Cada uno más doloroso que el anterior."
          51: "§8[§7...§8] §7El vacío no olvida."
      
      subfase_3:
        nombre: "§8§l━━━ §5III §8§l━━━"
        hp_min: 25
        hp_max: 50
        descripcion: "§5La Desesperación - §7El dragón lucha con fiereza renovada"
        
        dialogos_observador:
          50: "§8[§7...§8] §7Siempre creen que matarlo arregla algo."
          49: "§8[§7...§8] §8Como si la muerte tuviera significado aquí."
          48: "§8[§7...§8] §8Como si el fin de un guardián trajera paz."
          47: "§8[§7...§8] §7La paz es una ilusión en el End."
          45: "§8[§7...§8] §7No entienden…"
          44: "§8[§7...§8] §8Nunca entienden."
          43: "§8[§7...§8] §5El dragón no guarda el End."
          42: "§8[§7...§8] §7Es prisionero, no carcelero."
          40: "§8[§7...§8] §7El End guarda algo más."
          39: "§8[§7...§8] §8Algo oscuro. Antiguo."
          38: "§8[§7...§8] §8Algo que ni siquiera yo puedo ver del todo."
          36: "§8[§7...§8] §5Algo que prefiero no ver."
          35: "§8[§7...§8] §7Sus rugidos suenan… diferentes."
          34: "§8[§7...§8] §7Más… conscientes."
          33: "§8[§7...§8] §7¿Miedo? ¿Rabia?"
          32: "§8[§7...§8] §8¿Dolor existencial?"
          30: "§8[§7...§8] §5¿Reconocimiento?"
          29: "§8[§7...§8] §7¿Sabe que esto es inútil?"
          28: "§8[§7...§8] §8..."
          27: "§8[§7...§8] §8Creo que sí."
          26: "§8[§7...§8] §7Quizás él también sabe que esto es inútil."
      
      subfase_4:
        nombre: "§8§l━━━ §4IV §8§l━━━"
        hp_min: 0
        hp_max: 25
        descripcion: "§4El Ocaso - §cLa furia final antes del silencio"
        
        dialogos_observador:
          24: "§8[§7...§8] §c§lLa fase final."
          23: "§8[§7...§8] §4El fin de este ciclo se acerca."
          22: "§8[§7...§8] §7Siempre la más desesperada."
          21: "§8[§7...§8] §cEl dragón lucha con todo lo que le queda."
          20: "§8[§7...§8] §4El dragón se aferra a lo que queda de sí mismo."
          19: "§8[§7...§8] §7Cada rugido es un lamento…"
          18: "§8[§7...§8] §8Pero el desenlace ya está escrito."
          16: "§8[§7...§8] §5Escrito mil veces antes."
          15: "§8[§7...§8] §7Escrito en cenizas y ciclos."
          14: "§8[§7...§8] §8En sangre dimensional y memorias rotas."
          13: "§8[§7...§8] §5Grabado en este vacío sin tiempo."
          11: "§8[§7...§8] §7Sus alas se quiebran… otra vez."
          10: "§8[§7...§8] §7El mundo avanza."
          9: "§8[§7...§8] §4Pero el End permanece inmutable."
          8: "§8[§7...§8] §7Los jugadores celebran victorias."
          7: "§8[§7...§8] §cVictorias que ya han celebrado antes."
          6: "§8[§7...§8] §7Creen que han cambiado algo."
          5: "§8[§7...§8] §8Pero la memoria… no avanza."
          4: "§8[§7...§8] §5La memoria está atrapada."
          3: "§8[§7...§8] §4La memoria solo… repite."
          2: "§8[§7...§8] §c§oEternamente."
          1: "§8[§7...§8] §8§oY yo… sigo observando."
  
  # ═══ FASE 4: VICTORIA ═══
  fase_4_victoria:
    nombre: "§8Victoria"
    
    delay_post_muerte: 60  # Esperar 60 ticks (3s) para animación vanilla
    
    secuencia:
      - delay: 0
        texto:
          - "§8§l━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "§f"
          - "§8El End guarda silencio."
          - "§f"
      
      - delay: 60
        texto:
          - "§7El portal de regreso aparece."
          - "§8Pero algo ha cambiado."
      
      - delay: 100
        texto:
          - "§f"
          - "§8§l━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    
    mensaje_final: "§7Revisa tu inventario..."
  
  # ═══ FASE 5: CLIFFHANGER ═══
  fase_5_cliffhanger:
    nombre: "§8..."
    
    delay_inicio: 200  # 10 segundos después de la victoria
    
    mensaje:
      - "§f"
      - "§8§l⚡ §f§oAlgo se ha activado más allá de este mundo. §8§l⚡"
      - "§f"

# ═══════════════════════════════════════════════════════════════════
# CRISTALES DEL END
# ═══════════════════════════════════════════════════════════════════

cristales:
  cantidad: 12  # AUMENTADO: Más desafío épico
  regeneracion_hp_por_segundo: 1.5  # Regeneran más HP al dragón
  rango_curacion: 55
  
  recompensa_destruccion:
    exp: 150  # Más XP por cristal
    mensaje: "§8✓ Cristal destruido §5§l(X/12) §8⚡"
  
  bonus_todos_destruidos:
    mensaje: "§5§l⚡⚡⚡ TODOS LOS CRISTALES HAN CAÍDO §5§l⚡⚡⚡"
    efecto_jugadores:
      tipo: "REGENERATION"
      duracion: 800  # 40 segundos (antes 30)
      nivel: 3  # Nivel 3 (antes 2)

# ═══════════════════════════════════════════════════════════════════
# SISTEMA DE RECOMPENSAS
# ═══════════════════════════════════════════════════════════════════

recompensas:
  # Drops adicionales (vanilla da 12,000 EXP + huevo automáticamente)
  # RECOMPENSAS MEJORADAS para reflejar el desafío épico aumentado
  drops_garantizados:
    elytra_desolador:
      cantidad: 1
      probabilidad: 100
    escamas_vacio:
      cantidad_min: 8  # AUMENTADO: más escamas por batalla más larga
      cantidad_max: 15  # AUMENTADO
      probabilidad: 100
    experiencia_adicional:
      cantidad: 8000  # AUMENTADO: 8000 + 12000 vanilla = 20000 total
      distribucion: "proporcional"
  
  drops_probabilidad:
    corazon_desolador:
      probabilidad: 45  # AUMENTADO: más probable por dificultad
      cantidad: 1
    escama_perfecta:
      probabilidad: 25  # AUMENTADO
      cantidad_min: 2  # AUMENTADO
      cantidad_max: 4  # AUMENTADO
    fragmento_supremo:  # NUEVO: Item ultra-raro
      probabilidad: 10
      cantidad: 1
  
  # Recompensas de participación
  participacion:
    daño_minimo: 100  # AUMENTADO: Requiere más participación
    items:
      - "fragmento_vacio:5-8"  # AUMENTADO
      - "ender_pearl:8-15"  # AUMENTADO
      - "end_stone:64-96"  # AUMENTADO
      - "purpur_block:32-48"  # AUMENTADO
      - "chorus_fruit:16-32"  # NUEVO
    experiencia: 2000  # DUPLICADO
